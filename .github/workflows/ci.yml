name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests (CPU, mock backends)
    runs-on: ubuntu-22.04
    # Full CPU coverage includes thousands of cases and isolated subprocesses.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (CPU-only)
        run: |
          if ! command -v rsync >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y rsync
          fi
          pip install --upgrade pip
          pip install -e ".[dev,automation]"

      - name: Lint with ruff
        run: |
          ruff check ascendbench/ tests/ scripts/

      - name: Verify release boundary (release tarball excludes INTERNAL)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          # ``git archive HEAD`` defaults to the .gitattributes baked into
          # the archived tree (HEAD itself), NOT the working tree.
          # ``--worktree-attributes`` switches to reading the working-tree
          # .gitattributes, so a PR that updates the boundary rules is
          # exercised against its own (possibly-uncommitted) rules.
          git archive HEAD --format=tar --worktree-attributes -o "$tmp/release.tar"
          # Same explicit-rc discipline as the bench-core and external-name
          # grep steps below: 0=found(=fail), 1=clean(=pass), 2+=error(=fail loud).
          # The bare `if tar tf | grep` form is fail-open: a failing `tar tf`
          # plus an empty grep returns 1 → if-branch is skipped → false PASS.
          rc=0
          tar tf "$tmp/release.tar" \
            | grep -E '(scripts/automation|scripts/loop/|scripts/internal/|tab_automation)' \
            || rc=$?
          if [ "$rc" = "0" ]; then
            echo 'Release tarball MUST NOT contain INTERNAL automation / loop / plans / triage'
            exit 1
          elif [ "$rc" != "1" ]; then
            echo "tar|grep pipeline failed with rc=$rc — fail loud"
            exit "$rc"
          fi

      - name: Verify shipped modules do not import orchestrator (single-direction)
        run: |
          set -euo pipefail
          # Scan the ACTUAL shipped artefact (post export-ignore), not an
          # enumerated working-tree path list: every ``.py`` that survives
          # ``git archive`` is public surface and MUST NOT depend on the
          # INTERNAL orchestrator. Dependency direction is strictly
          # orchestrator -> bench core, never the reverse.
          tmp=$(mktemp -d)
          git archive HEAD --format=tar --worktree-attributes -o "$tmp/release.tar"
          tar xf "$tmp/release.tar" -C "$tmp"
          rm "$tmp/release.tar"
          # GNU grep exit codes: 0=found(=fail), 1=no match(=pass), 2=error(=fail loud).
          # Explicit rc capture so read errors do NOT fail-open under `if grep`.
          rc=0
          grep -rn --include='*.py' \
            'from automation\b\|import automation\b\|scripts\.automation\|tab_automation\b' \
            "$tmp" || rc=$?
          if [ "$rc" = "0" ]; then
            echo 'shipped module MUST NOT reference orchestrator (scripts.automation)'
            exit 1
          elif [ "$rc" != "1" ]; then
            echo "grep failed with rc=$rc (read error) — fail loud"
            exit "$rc"
          fi

      - name: Verify release tarball does not reference external project names
        run: |
          # Scope = files that actually ship in the release tarball.
          #
          # We deliberately scan the ``git archive`` output (post export-ignore)
          # rather than the working tree because:
          #   1. GNU grep ``--exclude-dir`` matches only the basename, not a
          #      path -- ``--exclude-dir=scripts/loop`` would NOT exclude
          #      ``scripts/loop/foo.py`` and CI would self-trip on INTERNAL
          #      regex strings inside the boundary tests themselves.
          #   2. The release contract is about the shipped artefact. Scanning
          #      the tarball aligns the check with the contract and avoids
          #      maintaining a parallel ``--exclude`` list of INTERNAL files.
          set -e
          tmp=$(mktemp -d)
          git archive HEAD --format=tar --worktree-attributes -o "$tmp/release.tar"
          tar xf "$tmp/release.tar" -C "$tmp"
          rm "$tmp/release.tar"
          # Same exit-code discipline as the bench-core single-direction step:
          # rc=0 means found (fail), rc=1 means clean (pass), rc=2 means grep error (fail loud).
          #
          # IMPORTANT: ``ci.yml`` itself ships in the release tarball
          # (it lives under ``.github/`` which is NOT export-ignored).
          # If we wrote the literal external-project tokens here, the
          # grep below would match its own ci.yml under "$tmp" -- a
          # guaranteed self-trip. Build the search pattern from
          # adjacent shell strings instead so the on-disk yaml never
          # contains the complete tokens as a literal substring.
          tok1='kernel''pilot'
          tok2='Kernel''Pilot'
          tok3='kp''_'
          pat="${tok1}\\|${tok2}\\|${tok3}"
          rc=0
          grep -rin "$pat" "$tmp" || rc=$?
          if [ "$rc" = "0" ]; then
            echo 'release artifact MUST NOT reference external project names'
            exit 1
          elif [ "$rc" != "1" ]; then
            echo "grep failed with rc=$rc — fail loud"
            exit "$rc"
          fi

      - name: Type check (mypy, soft mode)
        continue-on-error: true
        run: |
          mypy ascendbench/ || true

      - name: Run unit tests
        env:
          TAB_BACKEND: mock
          TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
          OMP_NUM_THREADS: "1"
        run: |
          pytest tests/unit_tests/ -v --cov=ascendbench --durations=25

      - name: Validate task manifests against schema
        run: |
          # Golden tensors are machine-local; release artifact validation keeps
          # the default golden requirement and --release-gate-strict.
          python scripts/corpus/validate_tasks.py --strict --source-only

      - name: Verify version matrix
        run: |
          python scripts/provenance/verify_version_matrix.py

      - name: Phase A′ release gate (S6 — eligible ∩ status!=PASS ⇒ block)
        # SEPARATE from the schema/hash step above. Non-vacuity guarded:
        # an empty / wrong task root HARD-fails (never vacuous-pass).
        # S6 is a HARD gate: a failing release gate MUST turn CI red
        # (no continue-on-error). Until every score-eligible task is
        # S2-gpu-authoritative PASS this step (correctly) fails CI —
        # that is the intentional S6 hard gate, not a CI flake.
        run: |
          python scripts/corpus/validate_tasks.py --release-gate

  adversarial-tests:
    name: Adversarial defense self-checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        # Pinned to 3.11 (the requires-python>=3.11 lower bound) so CI keeps
        # exercising the minimum supported interpreter; unit-tests runs 3.12.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run static-checker adversarial tests
        env:
          TAB_BACKEND: mock
        run: pytest tests/unit_tests/test_static_checker.py tests/unit_tests/test_adversarial.py -v

  gpu-baseline-smoke:
    name: GPU triton baseline smoke (manual trigger only)
    runs-on: [self-hosted, gpu, h100]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - name: Build GPU Docker image
        # Dockerfile.gpu has no default BASE_IMAGE. The self-hosted GPU
        # runner must define a TAB_GPU_BASE_IMAGE repository variable
        # pointing at an image with torch>=2.9 / triton>=3.5 / CUDA 12.6.
        run: docker build -f docker/Dockerfile.gpu --build-arg BASE_IMAGE=${{ vars.TAB_GPU_BASE_IMAGE }} -t tab-gpu:ci .
      - name: Run 5-task PoC smoke
        run: |
          docker run --rm --gpus all -v $(pwd)/results:/workspace/results tab-gpu:ci \
            tab run-suite --level 1 --solutions-root /workspace/solutions \
            --backend gpu --out /workspace/results/h100_gpu_triton/ci_smoke.json

  # NPU verified runner is intentionally NOT in standard CI —
  # runs on dedicated 910B host triggered by verified_runner.yml.
