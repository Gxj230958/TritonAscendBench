# 910B Roofline peak table — per-compute-class π_c / per-resource β_r
#
# Purpose: Roofline theoretical-latency baseline for scoring
#   t_ref = max( max_c W_c/π_c , max_r M_r/β_r )   (DESIGN-V2 §5.6 / §9)
# where W_c = FLOPs of compute-class c, π_c = 910B peak compute for that class;
#       M_r = bytes of resource r,   β_r = peak bandwidth of that resource.
#
# Locked at the same level as infra/version_matrix.toml (design spec §5.6).
# Refined in granularity from the coarse-grained peak_* fields in version_matrix.toml [hardware.910b].
#
# Data-source annotation convention:
#   - each value states its source and unit in an inline comment;
#   - values that cannot be confirmed from public specs are marked `# [unverified]`, to be verified on real 910B hardware,
#     never fabricating precise numbers to pose as authoritative.
#
# Device identity: Huawei Ascend 910B / Atlas A2 training series.
# Note: 910B has multiple SKUs (910B1/B2/B3/B4); peaks vary slightly with SKU and dtype;
#     the table below uses common public-spec tiers; the specific release must be locked on real hardware in the v0.1 release.

schema_version = "1.0"
device = "Ascend 910B / Atlas A2"
# Mapping to the coarse-grained fields in version_matrix.toml [hardware.910b]:
#   peak_fp16_tflops=256  -> [compute_class.fp16_cube].peak_tflops
#   peak_int8_tops=512    -> [compute_class.int8].peak_tops
#   hbm_bandwidth_gbps=1600 -> [resource.hbm].peak_bandwidth_gbps

# ============================================================================
# per-compute-class peak compute π_c
#   unit: peak_tflops (10^12 FLOP/s) — the int8 class uses peak_tops (10^12 OP/s).
#   the loader normalizes uniformly to FLOP/s (i.e. *1e12) for direct use in the t_ref formula.
# ============================================================================

[compute_class.fp16_cube]
# Cube (matrix) unit fp16 accumulate peak compute.
peak_tflops = 256.0   # TFLOP/s; Huawei public spec, consistent with version_matrix [hardware.910b].
provenance = "huawei-official"
description = "Cube unit, fp16 matrix multiply-accumulate"

[compute_class.bf16_cube]
# Cube unit bf16 peak. Public specs do not list bf16 separately; assumed same tier as fp16 (same matrix pipeline).
peak_tflops = 256.0   # TFLOP/s; assumed same tier as fp16_cube, not officially listed separately. No task references bf16_cube.
provenance = "architecture-estimate"
description = "Cube unit, bf16 matrix multiply-accumulate"

[compute_class.int8]
# Cube unit int8 quantized peak compute.
peak_tops = 512.0     # TOP/s; Huawei public spec, consistent with version_matrix [hardware.910b].
provenance = "huawei-official"
description = "Cube unit, int8 quantized multiply-accumulate"

[compute_class.vector]
# Vector (SIMD/AIV) unit peak compute. Huawei does not list vector separately; uses a third-party academic spec
# (arXiv 2505.14022 Table1 910B2C 48-AIV Vector@FP16=20T + CSET, consistent with the microarchitecture estimate).
peak_tflops = 20.0    # TFLOP/s FP16; provenance=academic-spec -> usable for ranking, absolute efficiency %
                      # pending 910B microbench. SKU-dependent: 48 AIV=20T / 40 AIV=16.7T,
                      # confirm the machine SKU with npu-smi, then fill in the matching value.
provenance = "third-party-academic-spec"
description = "Vector unit, elementwise / reduction FLOPS"

# ============================================================================
# per-resource peak bandwidth β_r
#   unit: peak_bandwidth_gbps (GB/s). The loader normalizes to byte/s (*1e9).
# ============================================================================

[resource.hbm]
# On-package HBM (on-package memory) peak bandwidth.
peak_bandwidth_gbps = 1600.0  # GB/s; Huawei public spec, consistent with version_matrix [hardware.910b].
provenance = "huawei-official"
description = "On-package HBM memory bandwidth"

[resource.interconnect]
# Cross-device interconnect bandwidth (HCCS / inter-card communication), used to normalize the
# communication bytes M_r of multi-card ops (allreduce / all2all, etc.). The 910B Atlas A2 inter-card interconnect (HCCS) public spec varies by server form factor
# (e.g. 8-card fully-connected topology); there is no single authoritative number.
peak_bandwidth_gbps = 0.0     # GB/s; [unverified] — cross-device interconnect bandwidth varies with Atlas A2
                              # server topology; public specs have no single authoritative value, placeholder 0.0.
                              # the loader rejects resources with β_r<=0 and errors out, requiring verification before use.
description = "Cross-device interconnect (HCCS) bandwidth for collective ops"
