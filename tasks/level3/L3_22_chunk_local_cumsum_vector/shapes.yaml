inputs:
  g:
    # V9 codex review 2026-05-27 (round 2): the kernel does per-chunk
    # cumsum (resets at every `chunk_size` boundary). Old oracle did a
    # plain torch.cumsum over the full sequence axis, so for L > BT it
    # was off by a constant per chunk -- a real oracle bug, not a
    # shapes issue. The companion fix in oracle_pytorch.py rewrites the
    # oracle to mirror the wrapper's own equivalence comment
    # `g.view(B, H, NT, BT, -1).cumsum(-2).view(B, H, T, -1)`.
    # We pin `head_first=True` so wrapper unpacks `B, H, T, S = g.shape`
    # and the oracle takes the matching `[B, H, T, S]` layout
    # without a transpose round-trip. `S` is per-head channel width and
    # reuses the existing `D` knob.
    dims:
    - B
    - H
    - L
    - D
    dtype: float32
    dist: randn
  reverse:
    scalar_knob: REV
  chunk_size:
    # Power-of-two BT that divides every shape's L AND clears Triton's
    # ``tl.dot`` minimum of K >= 16. Every L in this task
    # (16, 32, 64, 96, 128, 256, 512) is a multiple of 16. BT=8 built
    # clean refs but failed Triton compile inside the kernel
    # (``Input shapes should have M >= 1, N >= 1 and K >= 16`` at the
    # ``tl.dot(m_s, b_s)`` line) -- 16 is the smallest power-of-two
    # that satisfies both constraints.
    scalar: 16
  head_first:
    scalar: true
