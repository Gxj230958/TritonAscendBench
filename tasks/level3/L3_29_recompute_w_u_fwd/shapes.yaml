# Head-structured layouts matching the frozen kernel's make_block_ptr
# strides (non-varlen path). L is the sequence length T, C is the chunk
# size BT (L % C == 0), H is the value-head count, H//2 is the grouped
# (GQA) key-head count Hg (H % Hg == 0), D is the key dim K, Dv the value
# dim V. A's last axis is the LOCAL within-chunk column index of size BT,
# so A is block-diagonal in time.
#
# C (= BT) is the kernel's chunk-size TILING constant, not a free data
# axis: the kernel computes b_u = tl.dot(A[BT,BT], (beta*v)[BT,BV]) and
# b_w = tl.dot(A[BT,BT], (beta*exp(g)*k)[BT,BK]) with contraction dim BT.
# Triton's tl.dot requires that contraction dim to be a power of two and
# >= 16 (the tensor-core MMA tile minimum); upstream flash-linear-attention
# pins it to FLA_CHUNK_SIZE = 64. A non-pow2 or < 16 chunk size is an
# INVALID call to this kernel (real-GPU CompilationError "K >= 16"), so
# every shape uses C in {16, 32, 64}.
inputs:
  k:
    dims:
    - B
    - L
    - H//2
    - D
    dtype: float32
    dist: randn
  v:
    dims:
    - B
    - L
    - H
    - Dv
    dtype: float32
    dist: randn
  beta:
    dims:
    - B
    - L
    - H
    dtype: float32
    dist: rand
  g_cumsum:
    dims:
    - B
    - L
    - H
    dtype: float32
    dist: rand
  A:
    dims:
    - B
    - L
    - H
    - C
    dtype: float32
    dist: randn

explicit_view:
  P1:
    provenance: baseline
    tensors:
      k: '[4, 32, 2, 64] float32 axes=B,L,H//2,D dist=randn'
      v: '[4, 32, 4, 64] float32 axes=B,L,H,Dv dist=randn'
      beta: '[4, 32, 4] float32 axes=B,L,H dist=rand'
      g_cumsum: '[4, 32, 4] float32 axes=B,L,H dist=rand'
      A: '[4, 32, 4, 16] float32 axes=B,L,H,C dist=randn'
