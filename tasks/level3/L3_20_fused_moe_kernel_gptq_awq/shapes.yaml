# GPTQ/AWQ int4-w4a16 fused-MoE expert GEMM. The frozen kernel
# `fused_moe_kernel_gptq_awq` consumes 4-bit packed expert weights plus
# per-group dequant scales and zero-points; the fixture below supplies that
# real quantized layout (NOT a plain fp32 GEMM). Layout, per the kernel and
# the upstream `hidden_states.size(1)//2 == w1.size(2)` assert:
#   a            [B, D]            fp32 activations (D == contraction K)
#   b (qweight)  [E, N, D//2]      int32, two int4 nibbles packed along K
#                                  (k=2j low nibble, k=2j+1 high nibble)
#   b_scale      [E, N, D//GS]     fp32 per-(expert,n,group) dequant scale
#   b_zp         [E, N//2, D//GS]  int32, two int4 zero-points packed along N
#   topk_weights [B, 1]            fp32 routing weight (applied iff APPW)
#   sorted_token_ids [E*4]         int64 moe_align buffer (distinct ids,
#                                  sentinel == B for padding slots)
#   expert_ids   [E]               int64 per-block expert index in [0, E)
# Knob invariants the kernel requires: D % 64 == 0 and D even (b loaded
# unmasked over K, BLOCK_SIZE_K up to 64), N even (zp packs 2 nibbles per
# int32 along N), GS in {32,64,128} and GS | D (group dequant). top_k == 1.
size_knobs:
  B: 64
  D: 256
  N: 256
  E: 8
  GS: 128
  APPW: 0
