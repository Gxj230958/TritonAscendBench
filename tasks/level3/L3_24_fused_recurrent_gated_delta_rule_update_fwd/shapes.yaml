- id: H4
  name: h_wide
  knobs:
    B: 32
    T: 16
    H: 8
    D: 64
- id: H5
  name: h_vtiled
  # D = 48 so the kernel's value tiling (BV = min(pow2(V), 8) = 8) splits
  # into NV = cdiv(48, 8) = 6 tiles, exercising every i_v program and the
  # o_v < V mask -- a kernel that only wrote the first value tile would
  # pass the pow2-D shapes but fail here.
  knobs:
    B: 2
    T: 16
    H: 4
    D: 48
