inputs:
  q:
    dims: [B, H, C+R]
    dtype: bf16
    dist: randn
  k_buffer:
    dims: [B*S, 1, C+R]
    dtype: bf16
    dist: randn
  kv_indptr:
    dims: [B+1]
    dtype: int32
    dist: offsets:to=B*S
  kv_indices:
    dims: [B*S]
    dtype: int64
    dist: arange
  cos_sin_cache:
    dims: [P, R]
    dtype: bf16
    dist: rope_cos_sin
  positions:
    dims: [B]
    dtype: int64
    dist: randint:0:P
  kv_lora_rank: {scalar_knob: "C"}
  rotary_dim: {scalar_knob: "R"}
  num_kv_splits: {scalar: 1}
  sm_scale: {derive: "1/sqrt(C+R)"}
  logit_cap: {scalar: 0.0}
  use_rope: {scalar: true}
  is_neox_style: {scalar: true}
