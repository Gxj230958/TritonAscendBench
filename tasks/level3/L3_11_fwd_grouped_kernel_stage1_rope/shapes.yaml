# MLA decode stage1 (SGLang rocm_mla_decode_rope `_fwd_grouped_kernel_stage1_rope`).
# Knobs: B batch, H query heads, S kv tokens per batch (<= BLOCK_N=32 so the
# kernel's online softmax is a single tile == plain softmax), C kv_lora_rank
# (nope/latent dim), R qk_rope_head_dim == rotary_dim (full rotary), P max
# rope position. total_kv = B*S; one contiguous page of S tokens per batch.
# The real MLA caller passes V as an alias of k_buffer[..., :C], so the launcher
# and oracle derive that view instead of materialising an independent input.
size_knobs: {B: 4, H: 16, S: 16, C: 512, R: 64, P: 64}
public_shapes:
- {id: P1, name: tiny,   knobs: {B: 2, H: 4,  S: 8,  C: 64,  R: 16, P: 32}}
- {id: P2, name: small,  knobs: {B: 3, H: 8,  S: 16, C: 128, R: 32, P: 48}}
- {id: P3, name: medium, knobs: {B: 4, H: 16, S: 24, C: 256, R: 64, P: 64}}
- {id: P4, name: deepseek, knobs: {B: 4, H: 16, S: 32, C: 512, R: 64, P: 64}}
- {id: P5, name: wide,   knobs: {B: 2, H: 32, S: 16, C: 512, R: 64, P: 32}}
