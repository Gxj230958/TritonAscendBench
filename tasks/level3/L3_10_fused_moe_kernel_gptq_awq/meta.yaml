cost_model:
  # Symbol audit (approach §3.4). GPTQ/AWQ int4-w4a16 fused MoE expert GEMM:
  # for each padded block of sorted tokens, dequantize that block's expert
  # weight (w = (q - zp) * scale) then multiply by it, optionally scaling by
  # the token's routing weight. shapes.yaml binds: B -> n_tokens (a dim 0,
  # the gather domain), D -> hidden_dim K (a dim 1, the GEMM contraction;
  # b's packed K extent is D//2 int32), E -> n_experts (b dim 0, expert_ids
  # length; sorted_token_ids has E*4 entries so with block_size=4 there are
  # nblk = E padded blocks of 4 rows = E*4 padded rows), N -> expert output
  # width (b dim 1, BLOCK_SIZE_N axis), GS -> dequant group_size (D//GS
  # groups), APPW -> the apply_weight scalar_knob in [0,1]. block_size is the
  # literal 4. The kernel scatters each block-row store to C[token_id] in the
  # [B,N] token-id output domain; the compute/store TRAFFIC iterates the E*4
  # padded rows.
  # Mixed compute -> map form. FLOPs(fp16_cube): accumulator = tl.dot(a, b)
  # over the dequantized weight. Per block a[rows] @ w[e].T is a
  # [block_size,D]@[D,N] matmul = 2*4*N*D; over E blocks -> 8*E*N*D. float32
  # operands run on the 910B Cube unit; peak_table has no fp32 cube class so
  # cube matmul keys to fp16_cube. FLOPs(vector): per-element dequant of the
  # int4 weight (subtract zp, multiply scale) over the E*N*D weight elements
  # -> 2*E*N*D, plus the routing-weight epilogue y *= topk_weights (only when
  # apply_weight is set) -> APPW*4*E*N.
  # bytes(hbm): read a's gathered rows [E*4,D] (padded-row extent) fp32 +
  # packed weights b [E,N,D//2] int32 (4 bytes) + b_scale [E,N,D//GS] fp32 +
  # b_zp [E,N//2,D//GS] int32, write output [E*4,N] fp32; fp32 primary family
  # -> dtype_size. topk_weights [B,1] is gathered (one per padded row) only
  # when apply_weight is set -> APPW*4*E fp32. sorted_token_ids [E*4] and
  # expert_ids [E] are int64 index tensors (non-primary, approach §3.2) -> *8.
  flops:
    fp16_cube: 8*E*N*D
    vector: 2*E*N*D + APPW*4*E*N
  bytes:
    hbm: (4*E*D + 4*E*N + APPW*4*E)*dtype_size + (E*N*(D//2) + (E*N//2)*(D//GS))*4 + (E*N*(D//GS))*dtype_size + (4*E + E)*8
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
