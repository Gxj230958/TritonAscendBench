  dists:
    a:
      kind: randn
    b:
      kind: randint
      args:
        lo: '0'
        hi: '256'
    b_scale:
      kind: rand
    b_zp:
      kind: randint
      args:
        lo: '0'
        hi: '256'
    topk_weights:
      kind: rand
    sorted_token_ids:
      kind: moe_sorted_ids
      args:
        B: B
    expert_ids:
      kind: randint
      args:
        lo: '0'
        hi: E
  scalars:
    block_size: block_size >= 1
    group_size: group_size >= 1
    apply_weight: apply_weight in [0, 1]
  tensor_invariants:
  # sorted_token_ids holds distinct token ids in [0, B) plus the padding
  # sentinel == B (num_valid_tokens), which the kernel masks via
  # `offs_token < num_valid_tokens`; valid range is [0, B], upper bound B+1.
  - type: index_in_range
    args:
      input: sorted_token_ids
      value: B+1
  - type: index_in_range
    args:
      input: expert_ids
      value: E
