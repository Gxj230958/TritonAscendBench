inputs:
  x:
    dims:
    - B
    - "E*G"
    dtype: bfloat16
    dist: randn
  weights:
    dims:
    - E
    - N
    - G
    dtype: bfloat16
    dist: randn
  seg_indptr:
    dims:
    - E+1
    dtype: int64
    dist: offsets:to=B
  weight_indices:
    dims:
    - E
    dtype: int64
    dist: randint:0:E
  lora_ranks:
    dims:
    - E
    dtype: int64
    dist: randint:1:G
  scalings:
    dims:
    - E
    dtype: float32
    dist: rand
  slice_offsets:
    dims: ["E+1"]
    dtype: int32
    dist: "offsets:to=N"
  max_slice_size:
    scalar_knob: N
  base_output: null
