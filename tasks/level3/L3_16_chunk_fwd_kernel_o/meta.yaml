    oracle_kernel_equivalence: NEEDS_MANUAL
    verified_at: '2026-05-31T00:00:00Z'
    tolerance_class_used: recurrent_chunk
    equivalence_per_shape: {}
    golden_source: oracle_reauthored_chunk_output_contract
    notes: >-
      oracle_pytorch.py re-authored to the upstream headed chunk-output
      contract of the frozen wrapper `chunk_fwd_o` (q/k:[B,T,Hg,K],
      v:[B,T,H,V], h:[B,NT,H,V,K] per-chunk state snapshots, g:[B,T,H] ->
      o:[B,T,H,V], BT=FLA_CHUNK_SIZE=64). shapes.yaml + param_constraints
      aligned to that layout; the wrapper binds by name (no _pa_launcher
      needed). Three load-bearing inputs are pinned to be DISCRIMINATING on
      the committed seeded fixture: (1) h's chunk index -- all rows span
      NT>=2 (T>=65) so chunk i_t reads its OWN h[:, i_t]; a shared-state
      kernel diverges (P1 rel ~0.26). (2) head grouping i_h // (H//Hg) --
      all rows pin Hg<H (group>=2) so an identity head map mis-reads q/k
      (P1 rel ~1.45). (3) the within-chunk causal+g-decay mask on A (drop
      causal rel ~1.33, drop g-decay rel ~0.41). Oracle cross-checked
      against a literal make_block_ptr transcription of the kernel body
      (rel err ~2e-8, float32 round-off). Numeric oracle-vs-kernel
      equivalence requires a GPU/NPU run to populate (the FLA chunk kernels
      do not execute under TRITON_INTERPRET on a driverless host).
param_constraints:
  scaffold: false
  dims:
  # NT = ceil(T/64) >= 2 (T >= 65) keeps h's per-chunk index load-bearing:
  # chunk i_t reads h[:, i_t], so a single shared state diverges from chunk 1.
  - B >= 1
  - T >= 65
  - H >= 1
  - Hg >= 1
  - K >= 1
  - V >= 1
  # Hg < H (and H % Hg == 0) makes the kernel's integer head grouping
  # i_h // (H // Hg) non-trivial; group == 1 would not exercise GQA mapping.
  - H % Hg == 0
  - Hg < H
  dtypes:
    q: float32
    k: float32
    v: float32
    h: float32
    g: float32
  dists:
    q:
      kind: randn
    k:
      kind: randn
    v:
      kind: randn
    h:
      kind: randn
    g:
      kind: rand
  scalars:
    scale:
      derive: 1/sqrt(K)
  # Layouts (q/k[B,T,Hg,K], v[B,T,H,V], h[B,NT,H,V,K], g[B,T,H]) are enforced
  # structurally by shapes.yaml.inputs.dims; this op has no value-domain
  # invariants (all inputs dense randn/rand).
  tensor_invariants: []
