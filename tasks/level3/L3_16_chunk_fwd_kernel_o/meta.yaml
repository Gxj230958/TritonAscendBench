cost_model:
  # Per (B, H) program over NT = ceil(T/64) chunks, chunk size BT = 64.
  # Cube ops per chunk row-block: inter q@h^T (BT*V*K), the score A = q@k^T
  # (BT*BT*K) and intra A@v (BT*BT*V). Summed across all rows (NT*BT ~ T):
  #   inter  -> 2*B*H*T*K*V,  A -> 2*B*H*T*BT*K,  intra -> 2*B*H*T*BT*V.
  flops:
    fp16_cube: 2*B*H*T*K*V + 2*B*H*T*64*K + 2*B*H*T*64*V
    # exp(g) gating on inter (B*H*T*V) and on A (B*H*T*BT), plus the final
    # scale + add (B*H*T*V).
    vector: 2*B*H*T*V + B*H*T*64
  bytes:
    # Reads q/k ([B,T,Hg,K]), v ([B,T,H,V]), h ([B,NT,H,V,K], NT=T/64),
    # g ([B,T,H]); writes o ([B,T,H,V]).
    hbm: (2*B*T*Hg*K + 2*B*T*H*V + B*(T/64)*H*V*K + B*T*H) * dtype_size
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
