# Operator-family knob grid for chunk_fwd_kernel_o (vLLM fla ops, chunk_o.py).
# Layout follows the frozen upstream host wrapper `chunk_fwd_o` exactly:
#   q: [B, T, Hg, K]   k: [B, T, Hg, K]   v: [B, T, H, V]
#   h: [B, NT, H, V, K]   g: [B, T, H]   scale = 1/sqrt(K)
#   output o: [B, T, H, V],  BT = FLA_CHUNK_SIZE = 64,  NT = ceil(T/BT).
#
# h is the per-CHUNK state snapshot the kernel reads with i_tg = i_b*NT + i_t,
# i.e. chunk i_t reads its OWN slice h[:, i_t]. NT >= 2 is mandatory (T >= 65)
# so that index is load-bearing: a kernel/oracle that uses a single shared
# state instead of the per-chunk slice diverges from chunk 1 onward. Do NOT
# lower any T below 65 or the chunk-index dependence stops being tested.
#
# Hg < H (here Hg == H/2, so group = H // Hg = 2 != 1) makes the kernel's
# head-grouping `i_h // (H // Hg)` non-trivial: value head h reads q/k head
# h // group. An identity head map would mis-read q/k for half the heads.
# H % Hg == 0 is required by that integer grouping.
size_knobs:
  B: 8
  T: 192
  H: 16
  Hg: 8
  K: 128
  V: 128
public_shapes:
- id: P1
  name: tiny
  knobs:
    B: 2
    T: 80
    H: 4
    Hg: 2
    K: 32
    V: 32
- id: P2
  name: small
  knobs:
    B: 4
    T: 144
    H: 8
    Hg: 4
    K: 64
    V: 64
- id: P3
  name: medium
  knobs:
    B: 8
    T: 192
    H: 16
    Hg: 8
    K: 128
    V: 128
- id: P4
  name: large
  knobs:
    B: 4
    T: 256
    H: 8
    Hg: 4
    K: 128
    V: 128
- id: P5
  name: wide
  knobs:
    B: 2
    T: 130
    H: 8
    Hg: 2
    K: 64
    V: 128
hidden_shapes:
- id: H1
  name: h_groupwide
  knobs:
    B: 3
    T: 160
    H: 12
    Hg: 4
    K: 96
    V: 96
inputs:
  q:
    dims:
    - B
    - T
    - Hg
    - K
    dtype: bf16
    dist: randn
  k:
    dims:
    - B
    - T
    - Hg
    - K
    dtype: bf16
    dist: randn
  v:
    dims:
    - B
    - T
    - H
    - V
    dtype: bf16
    dist: randn
  h:
    dims:
    - B
    - ceil(T/64)
    - H
    - V
    - K
    dtype: bf16
    dist: randn
  g:
    dims:
    - B
    - T
    - H
    dtype: float32
    dist: logsigmoid
  scale:
    derive: 1/sqrt(K)
