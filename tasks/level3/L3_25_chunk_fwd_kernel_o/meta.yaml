    notes: 'oracle_pytorch.py re-authored to the upstream headed chunk-output contract
      of the frozen wrapper `chunk_fwd_o` (q/k:[B,T,Hg,K], v:[B,T,H,V], h:[B,NT,H,V,K]
      per-chunk state snapshots, g:[B,T,H] -> o:[B,T,H,V], BT=FLA_CHUNK_SIZE=64).
      shapes.yaml + param_constraints aligned to that layout; the wrapper binds by
      name (no _pa_launcher needed). Three load-bearing inputs are pinned to be DISCRIMINATING
      on the committed seeded fixture: (1) h''s chunk index -- all rows span NT>=2
      (T>=65) so chunk i_t reads its OWN h[:, i_t]; a shared-state kernel diverges
      (P1 rel ~0.26). (2) head grouping i_h // (H//Hg) -- all rows pin Hg<H (group>=2)
      so an identity head map mis-reads q/k (P1 rel ~1.45). (3) the within-chunk causal+g-decay
      mask on A (drop causal rel ~1.33, drop g-decay rel ~0.41). Oracle cross-checked
      against a literal make_block_ptr transcription of the kernel body (rel err ~2e-8,
      float32 round-off). Numeric oracle-vs-kernel equivalence requires a GPU/NPU
      run to populate (the FLA chunk kernels do not execute under TRITON_INTERPRET
      on a driverless host).'
    cross_check: S2_FRESH
