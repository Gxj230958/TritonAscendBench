inputs:
  query:
    dims:
    - B
    - H
    - D
    dtype: float32
    dist: randn
  key_cache:
    dims:
    - C
    - T
    - H
    - D
    dtype: float32
    dist: randn
  value_cache:
    dims:
    - C
    - T
    - H
    - D
    dtype: float32
    dist: randn
  block_table:
    dims:
    - B
    - N
    dtype: int64
    dist: randint:0:C
  seq_lens:
    dims:
    - B
    dtype: int64
    dist: randint:1:T
  scale:
    derive: 1/sqrt(D)
  key:
    dims:
    - B
    - H
    - N
    - D
    dtype: float16
    dist: randn
