# Operator input contract (WA.1, specs/task_api_contract.md §5.2). FLA chunk
# 16x16 -> 32x32 lower-tri inverse merge. kernel.py
# merge_16x16_to_32x32_inverse_kernel is hardwired to two fixed 16x16
# diagonal blocks (A11/A22) plus one 16x16 off-diagonal A21 (kernel.py:
# 161-166,192-203) — a 32x32 tile. The formula_exact_manual oracle
# (_merge_16x16_to_32x32_inverse) splits A at h = n//2; for it to match the
# kernel's hardwired 32x32 path the matrix must be exactly 32x32: D == 32. A
# is [B, 32, 32] block-lower-triangular float32 (tril dist; A12 == 0). Knob
# grid surgery pins D == 32 for every row.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - D == 32
  dtypes:
    A: float32
  dists:
    A:
      kind: tril
  scalars: {}
  tensor_invariants: []
