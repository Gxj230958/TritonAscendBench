# Aligned to kernel.py:521 wrapper signature `solve_tril(A, ...)` where
# A.shape == [B, T, H, BT] and BT is fixed at 32 for this task
# (kernel.py:556 -> merge_16x16_to_32x32_inverse_kernel branch).
# Each shape varies B / T / H along T-multiples of BT=32.

size_knobs:
  B: 2
  T: 32
  H: 2
  BT: 32
public_shapes:
- id: P1
  name: single_chunk
  knobs:
    B: 1
    T: 32
    H: 1
    BT: 32
- id: P2
  name: two_chunks
  knobs:
    B: 2
    T: 64
    H: 2
    BT: 32
- id: P3
  name: medium
  knobs:
    B: 4
    T: 128
    H: 4
    BT: 32
- id: P4
  name: large
  knobs:
    B: 8
    T: 256
    H: 8
    BT: 32
- id: P5
  name: deep
  knobs:
    B: 2
    T: 512
    H: 4
    BT: 32
hidden_shapes:
- id: H1
  name: h_odd_heads
  knobs:
    B: 3
    T: 96
    H: 3
    BT: 32
- id: H2
  name: h_singleton
  knobs:
    B: 1
    T: 32
    H: 1
    BT: 32
- id: H3
  name: h_deep
  knobs:
    B: 2
    T: 1024
    H: 6
    BT: 32
- id: H4
  name: h_wide_b
  knobs:
    B: 16
    T: 32
    H: 4
    BT: 32
inputs:
  A:
    dims:
    - B
    - T
    - H
    - BT
    dtype: float32
    # tril_chunk = dense strict-lower per [BT,BT] chunk; plain `tril` masks the
    # [H,BT] axes, leaving single-chunk H=1 shapes non-discriminating.
    dist: tril_chunk
