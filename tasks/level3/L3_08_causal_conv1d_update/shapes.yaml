inputs:
  # x: [batch, dim] -- the single new decode token. The wrapper unsqueezes to
  # [batch, dim, seqlen=1] internally.
  x:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  # conv_state: [num_cache_lines, dim, state_len] with num_cache_lines == B and
  # state_len == KW-1 (the rolling history window). Mutated in place: the kernel
  # rolls each selected line left by one and appends the new token.
  conv_state:
    dims:
    - B
    - D
    - KW-1
    dtype: bfloat16
    dist: randn
  # weight: [dim, KW] depthwise conv taps.
  weight:
    dims:
    - D
    - KW
    dtype: bfloat16
    dist: randn
  # bias: [dim] -- the kernel loads `bias_ptr + idx_feats` (no batch stride).
  bias:
    dims:
    - D
    dtype: bfloat16
    dist: randn
  # conv_state_indices: [batch] int32 -- LOAD-BEARING. Selects which cache line
  # each batch element reads its prior state from and writes the rolled state
  # back to. A single-cycle permutation (perm[i] = (i+1) % B) guarantees the
  # selected line differs from the batch position for every row, so a kernel
  # that ignores the index (reads/writes line i) mismatches the oracle on every
  # output and every cache line. Never an arange/identity here.
  conv_state_indices:
    dims:
    - B
    dtype: int32
    dist: cyclic_perm
  # activation: SiLU gate on the conv output.
  activation:
    scalar: silu
  # null_block_id: None -> HAS_NULL_BLOCK=False so no batch row is skipped as a
  # null/padding entry (this is a fully-populated decode batch, no padding). With
  # the upstream default NULL_BLOCK_ID==0, any index value 0 would otherwise make
  # the kernel early-return and leave that row's output/state untouched.
  null_block_id:
    scalar: null
