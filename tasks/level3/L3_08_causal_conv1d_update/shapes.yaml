# Operator-family knob grid: causal_conv1d_update is a single-step decode
# state update. The load-bearing axes are B (batch == num conv-state cache
# lines), D (feature dim) and KW (conv kernel width). The frozen update jit
# `_causal_conv1d_update_kernel` only implements KERNEL_WIDTH in {2..6}, so KW
# is held to small realistic conv widths {2,3,4}; conv_state carries the
# state_len == KW-1 history window the wrapper contract requires.
size_knobs:
  B: 8
  D: 512
  KW: 4
