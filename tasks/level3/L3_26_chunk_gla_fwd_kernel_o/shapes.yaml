# Operator-family knob grid for the ssm family. Head-structured layouts
# match the frozen kernel's make_block_ptr strides (non-varlen path):
# L is the sequence length T; C is the chunk size BT (L % C == 0); H is the
# head count; D is the key/query dim K; Dv the value dim V. NT = L // C is
# the number of chunks; the per-chunk state h carries that axis.
#
# C (= BT) is the kernel's chunk-size TILING constant, not a free data axis:
# the intra term is b_o += tl.dot(A[BT,BT], v[BT,BV]) with contraction dim
# BT, and the inter term is b_o += tl.dot(qg[BT,BK], trans(h)[BK,BV]).
# Triton's tl.dot requires the contraction dim to be a power of two and
# >= 16 (the tensor-core MMA tile minimum); upstream flash-linear-attention
# pins it to FLA_CHUNK_SIZE = 64. A non-pow2 or < 16 chunk size is an INVALID
# call to this kernel (real-GPU CompilationError "K >= 16"), so every shape
# uses C in {16, 32, 64} with L % C == 0.
size_knobs:
  B: 8
  L: 128
  D: 128
  Dv: 128
  N: 64
  T: 128
  H: 16
  E: 8
  C: 64
  G: 8
public_shapes:
- id: P1
  name: tiny
  knobs:
    B: 2
    L: 32
    D: 32
    Dv: 32
    C: 16
    H: 4
- id: P2
  name: small
  knobs:
    B: 4
    L: 128
    D: 64
    Dv: 64
    C: 32
    H: 8
- id: P3
  name: medium
  knobs:
    B: 8
    L: 256
    D: 128
    Dv: 128
    C: 64
    H: 16
- id: P4
  name: large
  knobs:
    B: 4
    L: 256
    D: 256
    Dv: 256
    C: 64
    H: 8
- id: P5
  name: wide
  knobs:
    B: 2
    L: 128
    D: 128
    Dv: 256
    C: 64
    H: 8
hidden_shapes:
- id: H1
  name: h_odd
  knobs:
    B: 3
    L: 96
    D: 96
    Dv: 96
    C: 16
    H: 6
- id: H2
  name: h_singleton
  knobs:
    B: 2
    L: 32
    D: 16
    Dv: 16
    C: 16
    H: 2
- id: H3
  name: h_deep
  knobs:
    B: 2
    L: 512
    D: 128
    Dv: 128
    C: 64
    H: 8
- id: H4
  name: h_wide
  knobs:
    B: 8
    L: 64
    D: 64
    Dv: 64
    C: 16
    H: 8
inputs:
  q:
    dims:
    - B
    - L
    - H
    - D
    dtype: float32
    dist: randn
  v:
    dims:
    - B
    - L
    - H
    - Dv
    dtype: float32
    dist: randn
  g:
    dims:
    - B
    - L
    - H
    - D
    dtype: float32
    dist: randn
  A:
    dims:
    - B
    - L
    - H
    - C
    dtype: float32
    dist: randn
  h:
    dims:
    - B
    - L//C
    - H
    - Dv
    - D
    dtype: float32
    dist: randn
  scale:
    derive: 1/sqrt(D)
