# Operator input contract (WA.1, specs/task_api_contract.md §5.2). FLA chunk
# solve_tril 16x16 path: kernel.py solve_tril_16x16_kernel is the BT==16 branch
# (kernel.py:52,78,98) and inverts one independent 16x16 diagonal tile per
# program (no cross-tile coupling — that is done by the merge_* kernels). The
# formula_exact_manual oracle (_solve_tril) inverts the full T x T lower-tri
# matrix via solve_triangular, so it equals the kernel's single-tile output
# only when the matrix fits one 16x16 tile: T <= 16. A is [T, T] lower-tri
# float32. Knob grid surgery (P4/H3 T: 32/64 -> 16) keeps every row T <= 16.
param_constraints:
  scaffold: false
  dims:
  - T >= 1
  - T <= 16
  dtypes:
    A: float32
  dists:
    A:
      kind: tril
  scalars: {}
  tensor_invariants: []
