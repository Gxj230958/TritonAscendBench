# Aligned to kernel.py:521 wrapper signature `solve_tril(A, ...)` where
# A.shape == [B, T, H, BT] and BT is fixed at 16 for this task
# (kernel.py:545 `assert A.shape[-1] in [16, 32, 64]`; the 16x16
# kernel branch at kernel.py:554 -> solve_tril_16x16_kernel).
# Each shape varies B / T / H along T-multiples of BT=16.

size_knobs:
  B: 2
  T: 16
  H: 2
  BT: 16
public_shapes:
- id: P1
  name: single_chunk
  knobs:
    B: 1
    T: 16
    H: 1
    BT: 16
- id: P2
  name: two_chunks
  knobs:
    B: 2
    T: 32
    H: 2
    BT: 16
- id: P3
  name: medium
  knobs:
    B: 4
    T: 64
    H: 4
    BT: 16
- id: P4
  name: large
  knobs:
    B: 8
    T: 128
    H: 8
    BT: 16
- id: P5
  name: deep
  knobs:
    B: 2
    T: 256
    H: 4
    BT: 16
hidden_shapes:
- id: H1
  name: h_odd_heads
  knobs:
    B: 3
    T: 48
    H: 3
    BT: 16
- id: H2
  name: h_singleton
  knobs:
    B: 1
    T: 16
    H: 1
    BT: 16
- id: H3
  name: h_deep
  knobs:
    B: 2
    T: 512
    H: 6
    BT: 16
- id: H4
  name: h_wide_b
  knobs:
    B: 16
    T: 16
    H: 4
    BT: 16
inputs:
  A:
    dims:
    - B
    - T
    - H
    - BT
    dtype: float32
    # tril_chunk = dense strict-lower per [BT,BT] chunk (the op's real plane);
    # plain `tril` masks the [H,BT] axes, leaving blocks nilpotent of degree H+1
    # so a solver that drops the forward-substitution recurrence passes trivially.
    dist: tril_chunk
