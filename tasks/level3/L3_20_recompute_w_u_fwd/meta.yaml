param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - L >= 1
  - D >= 1
  - Dv >= 1
  - H >= 2
  - C in {16, 32, 64}
  - L % C == 0
  - H % 2 == 0
  # C (= chunk size BT) is the kernel's tl.dot contraction/tiling constant;
  # Triton requires it to be a power of two and >= 16 (tensor-core MMA tile
  # minimum), and upstream pins FLA_CHUNK_SIZE = 64. A non-pow2 / < 16 chunk
  # size is an invalid kernel call (real-GPU CompilationError "K >= 16").
  dtypes:
    k: float32
    v: float32
    beta: float32
    g_cumsum: float32
    A: float32
  dists:
    k:
      kind: randn
    v:
      kind: randn
    beta:
      kind: rand
    g_cumsum:
      kind: rand
    A:
      kind: randn
  scalars: {}
  # Layouts (k[B,L,H//2,D], v[B,L,H,Dv], beta/g_cumsum[B,L,H], A[B,L,H,C])
  # are enforced structurally by shapes.yaml.inputs.dims; tensor_invariants
  # carries only value-domain predicates, of which this op has none.
  tensor_invariants: []
