inputs:
  q:
    dims:
    - B
    - H
    - D
    dtype: bfloat16
    dist: randn
  k_buffer:
    dims:
    - B*C
    - E
    - D
    dtype: bfloat16
    dist: randn
  v_buffer:
    dims:
    - B*C
    - E
    - Dv
    dtype: bfloat16
    dist: randn
  req_to_tokens:
    dims:
    - B*C
    dtype: int64
    dist: randperm
  b_seqlen:
    dims:
    - B
    dtype: int64
    dist: randint:1:C+1
  scale:
    derive: 1/sqrt(D)
  num_kv_splits:
    scalar: 4
