# Grouped (GQA) decode-attention stage-1 (flash-decoding partials).
# The authored _pa_launcher.py drives the frozen @triton.jit
# `_fwd_grouped_kernel_stage1` exactly as the upstream host wrapper
# `_decode_grouped_att_m_fwd` does (vLLM
# vllm/v1/attention/ops/triton_decode_attention.py, commit 18f6bf5a214).
#
# Knob roles for this operator family (NOT the legacy uniform template):
#   B  -> decode batch (one query token per request; q dim 0, att_out dim 0)
#   H  -> query head count H_Q (q dim 1, att_out dim 1, kernel BLOCK_H axis)
#   E  -> KV head count H_KV (k_buffer/v_buffer dim 1); kv_group_num = H/E
#         MUST be > 1 to exercise the grouped (GQA) head mapping
#   D  -> QK head dim Lk (q dim 2 == k_buffer dim 2, score contraction)
#   Dv -> value head dim Lv (v_buffer dim 2 == att_out context width)
#   C  -> max cached context length per request (req_to_tokens width;
#         k_buffer/v_buffer hold B*C cached latent tokens)
# NUM_KV_SPLITS (att_out dim 2, the flash-decoding split count) is the
# fixed `num_kv_splits` scalar (4, > 1 so the per-split online-softmax
# recurrence is exercised); it is NOT a size knob. L/N/T/G are legacy
# family knobs carried by the grid template but unused by this operator.
#
# Discrimination (every input below is load-bearing -- a kernel ignoring
# any one fails the oracle compare):
#   req_to_tokens `randperm` is a NON-identity global permutation of the
#   B*C cached slots; a kernel that gathers b*C+n directly (ignoring the
#   page table) reads the wrong tokens. b_seqlen `randint:1:C+1` gives a
#   DIFFERENT context length per request; a kernel that hard-codes the
#   full C ignores B_Seqlen and gets the split bounds wrong. scale,
#   q/k_buffer/v_buffer and the GQA head mapping are load-bearing by
#   construction.
size_knobs:
  B: 16
  L: 256
  D: 128
  Dv: 128
  N: 512
  T: 256
  H: 16
  E: 4
  C: 40
  G: 4
