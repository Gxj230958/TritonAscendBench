# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Paged 2D attention decode: query [B, H, D] attends over the paged key_cache / value_cache [C, T, H, D] via block_table [B, N] (cache-block ids in [0, C)) and per-request seq_lens [B]. scale is the QK scale, derived as 1/sqrt(D).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - H >= 1
  - D >= 1
  - C >= 1
  - T >= 1
  - N >= 1
  dtypes:
    query: float32
    key_cache: float32
    value_cache: float32
    block_table: int64
    seq_lens: int64
  dists:
    query:
      kind: randn
    key_cache:
      kind: randn
    value_cache:
      kind: randn
    block_table:
      kind: randint
      args:
        lo: '0'
        hi: C
    seq_lens:
      kind: randint
      args:
        lo: '1'
        hi: T
  scalars:
    scale:
      derive: 1/sqrt(D)
  tensor_invariants:
  - type: index_in_range
    args:
      input: block_table
      value: C
