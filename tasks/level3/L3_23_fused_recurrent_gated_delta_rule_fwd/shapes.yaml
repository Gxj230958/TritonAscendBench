- id: H5
  name: h_vtiled
  # D = 48 > 32 so the kernel's value tiling splits into NV = cdiv(48, 32) = 2
  # tiles with a partial second tile (BV = min(pow2(48), 32) = 32). Exercises
  # the i_v > 0 program and the o_v < V mask -- a kernel that only writes the
  # first value tile would pass every D <= 32 shape but fail here.
