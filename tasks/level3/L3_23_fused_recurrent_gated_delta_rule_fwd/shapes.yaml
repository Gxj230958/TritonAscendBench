# Knob grid for the dense gated-delta recurrent forward. q/k/v are
# [B, T, H, D]; g/beta are [B, T, H]; initial_state is [B, H, D, D] in
# the kernel's V-major state layout (D = Dv = K = V, square). T is kept
# small (<= 8) so the recurrence's exp(g) decay (g ~ U[0,1), so
# exp(g) > 1) and the randn-k feedback do not overflow fp32 -- the
# kernel and oracle share identical inputs, so the comparison stays
# honest; small T only keeps magnitudes finite. T >= 2 keeps the
# multi-step recurrence (and the initial-state carry) load-bearing.
size_knobs:
  B: 4
  T: 8
  H: 8
  D: 32
