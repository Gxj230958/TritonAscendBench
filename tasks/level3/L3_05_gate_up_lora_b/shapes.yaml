# Upstream contract (sglang gate_up_lora_b_fwd, frozen kernel.py):
#   x:               [S, 2*r]                 S = total tokens = E*C
#   gate_up_lora_b:  [num_lora, 2*output_dim, r]   weights, gate/up packed on dim 1
#   output:          [S, 2*output_dim]
# Segments: bs == num_segments == E adapters; each segment has fixed length
# C (knob), so seg_indptr = [0, C, 2C, ..., E*C] and seg_lens[b] == C.
# permutation is None -> SORTED_BY_ADAPTER False -> rows are contiguous
# (seg_start + offset), the deterministic upstream code path. r = G (max
# LoRA rank), output_dim = N. seg_indptr (offsets:to=E*C) is contiguous so
# both the oracle and the authored _pa_launcher.py derive seg_lens from
# diff(seg_indptr) (== C per segment), reconstructing the upstream batch_info
# fields from these flat tensors -- no sglang LoRABatchInfo struct is built.
- id: H5
  name: edge_CPU-valid; pending 
  knobs:
    C: 1
    E: 1
    G: 1
    N: 1
- id: H6
  name: edge_CPU-valid; pending 
  knobs:
    C: 24
    E: 1
    G: 4
    N: 384
- id: H7
  name: edge_CPU-valid; pending 
  knobs:
    C: 24
    E: 1
    G: 8
    N: 32768
- id: H8
  name: edge_CPU-valid; pending 
  knobs:
    C: 24
    E: 256
    G: 8
    N: 1
inputs:
  x:
    dims:
    - E*C
    - 2*G
    dtype: bfloat16
    dist: randn
  gate_up_lora_b:
    dims:
    - E
    - 2*N
    - G
    dtype: bfloat16
    dist: randn
  seg_indptr:
    dims:
    - E+1
    dtype: int64
    dist: offsets:to=E*C
  weight_indices:
    dims:
    - E
    dtype: int64
    dist: arange
  lora_ranks:
    dims:
    - E
    dtype: int64
    dist: randint:1:G+1
  scalings:
    dims:
    - E
    dtype: bfloat16
    dist: rand
  output_dim:
    scalar_knob: N

