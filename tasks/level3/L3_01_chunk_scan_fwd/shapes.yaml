# Operator-family knob grid for the Mamba2 SSD chunk-scan forward
# (vLLM _chunk_scan_fwd). The fixture materialises the PHYSICAL upstream input
# layout: per-token x/C/z and per-head D, plus a chunk_size scalar. The varlen
# chunk partition (cu_chunk_seqlens, seq_idx) and the per-chunk tensors
# (cb, dt, dA_cumsum, states) are DERIVED deterministically inside
# _pa_launcher.py / oracle_pytorch.py (byte-identical builders) because their
# chunk-axis length depends on (seqlen, chunk_size).
#
# Knobs:
#   S  = seqlen     (contiguous token stream length)
#   H  = nheads
#   G  = ngroups    (must divide H)
#   P  = headdim
#   N  = dstate
#   CS = chunk_size (power of two)
#
# S is chosen > CS so the non-uniform partition (see _partition) yields
# multi-chunk sequences -- this keeps the inter-chunk `states` term
# load-bearing (prev_states is the real states[c-1], not seq-restart zeros).
size_knobs:
  S: 256
  H: 8
  G: 4
  P: 64
  N: 64
  CS: 16
