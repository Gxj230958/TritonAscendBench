# Operator-family knob grid for chunk_scaled_dot_kkt_fwd (varlen / packed B=1).
# Layout follows the frozen upstream wrapper's IS_VARLEN path exactly:
#   k: [1, T, Hg, K]   beta: [1, T, H]   g: [1, T, H]
#   cu_seqlens: [NSEG+1] int64, monotonic, cu_seqlens[-1] == T (packed tokens).
#   output A: [1, T, H, BT], BT = FLA_CHUNK_SIZE = 64.
# Supplying cu_seqlens flips the kernel's IS_VARLEN heuristic on, so the host
# wrapper computes chunk_indices = prepare_chunk_indices(cu_seqlens, 64) and the
# kernel takes the varlen branch (bos/eos from cu_seqlens, per-segment chunk
# reset). B is pinned to 1: the varlen branch ignores i_b and addresses k / beta
# / g / A from the flat bos offset, so a packed batch MUST be a single B=1 plane
# (B>1 would alias the same packed storage). Hg == H here (the fla common case
# where Q/K share head counts), so the head-grouping i_h // (H // Hg) is the
# identity; the oracle keeps the GQA-general head_idx so the contract stays
# Hg<=H ready. T per row spans single-chunk segments (len < 64), multi-chunk
# segments (len > 64 with a non-64-multiple tail that exercises the m_t row
# mask), and multi-segment packs so the per-segment chunk grid genuinely shifts
# off the fixed-length BT boundary. `offsets:to=T` distributes T evenly over
# NSEG segments; T >= NSEG on every row keeps every segment non-empty (an empty
# segment would make prepare_chunk_indices renumber chunk seq ids densely and
# misalign bos/eos for later chunks).
size_knobs:
  T: 200
  H: 16
  Hg: 16
  K: 128
  NSEG: 4
