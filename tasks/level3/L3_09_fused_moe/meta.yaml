param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - D >= 1
  - E >= 1
  - N >= 1
  dtypes:
    a: float32
    b: float32
    topk_weights: float32
    sorted_token_ids: int64
    expert_ids: int64
  dists:
    a:
      kind: randn
    b:
      kind: randn
    topk_weights:
      kind: rand
    sorted_token_ids:
      kind: moe_sorted_ids
      args:
        B: B
    expert_ids:
      kind: randint
      args:
        lo: '0'
        hi: E
  scalars:
    block_size: block_size >= 1
    apply_weight: apply_weight in [0, 1]
  tensor_invariants:
  # sorted_token_ids holds distinct token ids in [0, B) plus the padding
  # sentinel == B (num_valid_tokens), which the kernel masks via
  # `offs_token < num_valid_tokens`; the valid index range is therefore
  # [0, B], so the upper bound is B+1 (exclusive).
  - type: index_in_range
    args:
      input: sorted_token_ids
      value: B+1
  - type: index_in_range
    args:
      input: expert_ids
      value: E
