# Operator-family knob grid: values reflect
# the convolution family's real axes.
# KW is the depthwise causal-conv KERNEL_WIDTH. The frozen
# `_causal_conv1d_fwd_kernel` only implements widths 2/3/4 in its main
# compute loop; 4 is the canonical Mamba causal_conv1d width and exercises
# all four weight taps plus the full 3-token causal history. It is a fixed
# kernel constant, not a swept size axis, so it is pinned to 4 everywhere.
size_knobs:
  B: 8
  L: 512
  D: 512
  KW: 4
  Dv: 8
  N: 512
  T: 256
  H: 16
  E: 16
  C: 32
  G: 8
