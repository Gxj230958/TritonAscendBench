inputs:
  q:
    dims:
    - B*L
    - H
    - D
    dtype: bfloat16
    dist: randn
  k:
    dims:
    - B*L
    # Fewer KV heads than Q (H//2) so kv_group_num = H/(H//2) = 2: exercises the
    # GQA head-grouping (kernel cur_head//kv_group_num, oracle repeat_interleave).
    # Pinning K/V to H q-heads made kv_group_num==1, leaving GQA untested.
    - H//2
    - D
    dtype: bfloat16
    dist: randn
  v:
    dims:
    - B*L
    - H//2
    - D
    dtype: bfloat16
    dist: randn
  b_start_loc:
    dims:
    - B+1
    dtype: int64
    dist: offsets:to=B*L
  b_seq_len:
    dims:
    - B
    dtype: int64
    dist: full:L
  is_causal:
    scalar_knob: CAUSAL
  sm_scale:
    derive: 1/sqrt(D)
  o:
    dims:
    - B*L
    - H
    - D
    dtype: float16
  max_input_len:
    scalar_knob: L
