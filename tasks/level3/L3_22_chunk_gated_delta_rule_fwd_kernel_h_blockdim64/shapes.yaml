# Operator-family knob grid for chunk_gated_delta_rule_fwd_h.
# Layout follows the frozen upstream wrapper exactly:
#   k: [B, T, Hg, K]   w: [B, T, H, K]   u: [B, T, H, V]
#   g: [B, T, H]       gk: [B, T, H, K]
#   output h: [B, NT, H, V, K], BT = FLA_CHUNK_SIZE = 64.
# Hg == H here (the fla common case where Q/K share head counts), so the
# kernel's head-grouping i_h // (H // Hg) is the identity. K, V <= 256 to
# respect the kernel assertion `K <= 256` and the blockdim64 K-tiling
# (K in {64,128,192,256}).
# gk drives the kernel's USE_GK branch (per-K-channel state decay by
# exp(gk[:, chunk_last])). Because that decay multiplies the carried state
# S whose chunk-0 value is zero (no initial_state) and h snapshots S at each
# chunk START, the decay only reaches a GRADED output from the chunk-2
# snapshot onward -- so every shape must span NT >= 3, i.e. T >= 129
# (= 2*BT + 1). Do NOT lower any T below 129 or the USE_GK branch stops
# affecting the output and becomes effectively untested.
size_knobs:
  B: 8
  T: 192
  H: 16
  K: 128
  V: 128
