# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Fused recurrent gated delta-rule update forward: q / k / v [B, T, H, D], per-step gate g and beta [B, T, H]. initial_state [B, HV, V, K] is the per-sequence state pool slot the kernel carries and overwrites. scale is the QK scale, derived as 2/sqrt(D) -- deliberately distinct from the kernel's built-in 1/sqrt(D) default so the supplied scalar is load-bearing.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - T >= 1
  - H >= 1
  - D >= 1
  dtypes:
    q: float32
    k: float32
    v: float32
    g: float32
    beta: float32
    initial_state: float32
  dists:
    q:
      kind: randn
    k:
      kind: l2norm_rows
    v:
      kind: randn
    g:
      kind: logsigmoid
    beta:
      kind: rand
    initial_state:
      kind: randn
  scalars:
    scale:
      derive: 2/sqrt(D)
  tensor_invariants: []
