# Operator-family knob grid for the KDA inter-sub scaled-dot KKT kernel
# chunk_kda_scaled_dot_kkt_fwd_kernel_intra_sub_inter.
#
# The frozen kernel consumes a dense [B, T, H, K] layout (non-varlen path)
# and writes A / Aqk of shape [B, T, H, BT] where BT = FLA_CHUNK_SIZE = 64.
# It fills ONLY the strictly off-diagonal sub-chunk blocks (sub-chunk width
# BC = min(16, BT) = 16, NC = BT/BC = 4), so a shape must give at least two
# occupied row sub-chunks (T > BC = 16) for the kernel to write anything.
# T is kept a multiple of BC = 16 so sub-chunk boundaries are clean; H1 uses
# T not a multiple of BT = 64 to exercise the partial-time-chunk boundary.
size_knobs:
  B: 4
  T: 128
  H: 8
  K: 128
public_shapes:
- id: P1
  name: tiny
  knobs:
    B: 2
    T: 64
    H: 4
    K: 32
