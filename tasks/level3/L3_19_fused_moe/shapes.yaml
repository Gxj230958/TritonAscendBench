inputs:
  a:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  b:
    dims:
    - E
    - N
    - D
    dtype: bfloat16
    dist: randn
  topk_weights:
    dims:
    - B
    - '1'
    dtype: float32
    dist: rand
  sorted_token_ids:
    dims:
    - E*4
    dtype: int64
    # moe_align_block_size output: distinct route-slot ids in [0, B) padded
    # with the sentinel == B. The fused_moe_kernel scatters C[sorted_token_ids
    # [r]], so ids MUST be unique (a bare randint:0:B collides and makes two
    # blocks race-write the same C row -- un-oracalable).
    dist: moe_sorted_ids:B
  expert_ids:
    dims:
    - E
    dtype: int64
    dist: randint:0:E
  block_size:
    scalar: 4
  apply_weight:
    scalar_knob: APPW

