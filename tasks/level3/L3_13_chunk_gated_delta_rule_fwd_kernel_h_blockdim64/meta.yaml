    notes: >-
      oracle_pytorch.py re-authored to the upstream chunked headed contract
      (k/w:[B,T,H,K], u:[B,T,H,V], g:[B,T,H], gk:[B,T,H,K] -> h:[B,NT,H,V,K],
      BT=64). shapes.yaml + param_constraints aligned to that layout;
      output_projection selects wrapper return index 0 (h). gk added to drive
      the kernel's USE_GK per-K-channel state-decay branch (exp(gk[:,last]));
      all shape rows pinned to NT>=3 (T>=129) so that decay reaches a graded h
      snapshot. Numeric oracle-vs-kernel equivalence requires a GPU/NPU run to
      populate.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  # T >= 129 (= 2*BT + 1, BT=64) guarantees NT >= 3 so the USE_GK
  # per-channel state decay reaches a graded h snapshot (chunk-2 onward).
  - T >= 129
  - H >= 1
  - K >= 1
  - V >= 1
  - K <= 256
  - V <= 256
  - K % 64 == 0
  dtypes:
    k: float32
    w: float32
    u: float32
    g: float32
    gk: float32
  dists:
    k:
      kind: randn
    w:
      kind: randn
    u:
      kind: randn
    g:
      kind: rand
    gk:
      kind: rand
  scalars: {}
  # No value-domain invariants: all inputs are dense randn/rand tensors.
  # Rank/shape contracts are enforced by shapes.yaml dims (k/w/gk [B,T,H,K],
  # u [B,T,H,V], g [B,T,H] -> h [B,ceil(T/64),H,V,K]).
  tensor_invariants: []
