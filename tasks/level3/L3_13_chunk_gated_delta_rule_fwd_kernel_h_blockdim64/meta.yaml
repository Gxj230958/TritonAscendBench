cost_model:
  # Symbol audit (approach §3.4). Gated DeltaNet chunk-level state
  # recurrence: per timestep S = exp(g_t)*S + k_t^T(u_t - w_t*S); output
  # is the stacked per-step states. shapes.yaml binds: B -> batch
  # (k/w/u dim 0, g dim 0, the kernel's batch axis), T -> sequence length
  # (k/w/u dim 1, g dim 1, the kernel's NT chunk loop covers it),
  # D -> feature dim (k/w/u dim 2; the oracle's state S is [B,D,Du] with
  # Du = u.shape[-1] = D, so both state axes are the D knob — the kernel
  # blockdim64 splits this D into 64-wide head blocks b_h1..b_h4).
  # Mixed compute -> map form. FLOPs(fp16_cube): the kernel does the
  # chunk-level state matmuls with tl.dot — b_v = tl.dot(b_w, trans(b_h))
  # and b_h += trans(tl.dot(b_k, b_v)). Analytically this equals the
  # recurrence's two contractions: kS = einsum("bd,bde->be", w, S) is a
  # [D]x[D,D] matvec = 2*D*D per (b,t); the state outer-product update
  # k_t (x) delta is 2*D*D per (b,t). Over B*T -> 4*B*T*D*D. float32
  # operands run on the 910B Cube unit, peak_table exposes no fp32 cube
  # class so cube matmul is keyed to fp16_cube. FLOPs(vector): decay =
  # exp(g_t) over B*T, delta = u_t - kS over B*T*D, decay*S mul and the
  # state add over B*T*D*D -> ~2*B*T*D*D + B*T*D.
  # bytes(hbm): read k/w/u [B,T,D] + g [B,T], write output (stacked
  # states) [B,T,D,D]; all float32 primary family -> dtype_size.
  flops:
    fp16_cube: 4*B*T*D*D
    vector: 2*B*T*D*D + B*T*D
  bytes:
    hbm: (3*B*T*D + B*T + B*T*D*D) * dtype_size
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
