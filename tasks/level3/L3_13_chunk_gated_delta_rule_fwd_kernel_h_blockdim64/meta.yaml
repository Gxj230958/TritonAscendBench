tolerance_class: recurrent_chunk
cost_model:
  # Chunked state recurrence over NT = ceil(T/64) chunks per (B, H) program.
  # Cube: dv = w @ S^T ([BT,K]x[K,V]) and S += k^T @ dv ([K,BT]x[BT,V]),
  # each 2*BT*K*V per chunk, summing to 4*B*H*T*K*V across all rows.
  # Vector: per-row value gating (B*H*T*V) plus the scalar g gate (B*T*H).
  flops:
    fp16_cube: 4*B*H*T*K*V
    vector: 2*B*H*T*V + B*T*H
  bytes:
    # Reads k/w/gk ([B,T,H,K] each, Hg==H), u ([B,T,H,V]), g ([B,T,H]);
    # writes the per-chunk state snapshot h ([B,NT,H,V,K], NT=T/64).
    hbm: (3*B*T*H*K + B*T*H*V + B*T*H + B*(T/64)*H*V*K) * dtype_size
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
