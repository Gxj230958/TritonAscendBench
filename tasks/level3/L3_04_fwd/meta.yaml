schema_version: '1.0'
benchmark_version: 0.1.0-poc
task_id: L3_04_fwd
level: L3
idx: 4
name: _fwd_kernel
repo: SGLang
dtype_class: CV
category: attention
npu_difficulty: high
upstream:
  repo: sgl-project/sglang
  path: python/sglang/srt/layers/attention/triton_ops/prefill_attention.py
  commit_sha: snapshot-no-git
  file_sha256: 1caf20af6c51c77d2fe01b73f9cd726625ae8e63aab09ca99682986c306f8bc0
  function_hash: 1caf20af6c51c77d2fe01b73f9cd726625ae8e63aab09ca99682986c306f8bc0
  license: Apache-2.0
  origin_note: 'sglang implementation adapted from ModelTC/lightllm. Both upstreams

    of this task.

    '
interface:
  alias_map:
    q: ro
    k: ro
    v: ro
    o: wo_runner_allocated
    b_start_loc: ro
    b_seq_len: ro
    max_input_len: ro
    is_causal: ro
    sm_scale: ro
  mutability: in_place_output_buffer
  stride_layout: q/k/v/o contiguous [total_tokens, head, head_dim]
  workspace_policy: none
  stream_sync_policy: runner-managed
  rng_state_policy: deterministic
oracle:
  pytorch: oracle_pytorch.py::run
  gpu_triton: kernel.py::context_attention_fwd
tolerance_class: attention_flash
cost_model:
  flops:
    fp16_cube: 4*B*H*D*(L*L - CAUSAL*L*(L-1)/2)
    vector: 8*B*H*(L*L - CAUSAL*L*(L-1)/2)
  bytes:
    hbm: 4*B*L*H*D*dtype_size + (2*B + 1)*8
  gpu_xcheck_tol: 0.05
oracle_simplified: upstream_oracle_required
runner_checks:
  expected_kernel_count_range:
  - 1
  - 1
  min_dram_bytes: 524288
  min_flops: 33554432
  output_format: safetensors
  output_allocation: runner_allocated
  static_checks:
  - ast_denylist
  - import_allowlist
  - constexpr_match
  - cube_arithmetic_present
  - online_softmax_present
  metamorphic_checks:
  - name: qk_scale_inverse
    description: 'Replacing (Q, K) with (αQ, K/α) for scalar α>0 leaves output

      unchanged (q·k product preserved exactly in fp32, modulo the

      final cast).

      '
  - name: zero_v_yields_zero
    description: v = 0 ⇒ o = 0 regardless of q, k.
  - name: single_token_per_seq_equals_v
    description: 'Every b_seq_len[i] = 1 ⇒ softmax over a single logit = 1 ⇒

      output equals v exactly.

      '
  shape_coverage:
    public: 6
    hidden: 5
is_canary: false
is_hidden_only: false
hardware:
  npu: 910b
  ub_budget_kb: 180
  fp8_required: false
  notes: 'head_dim ≤ 128 at v0.1. Larger head_dim (DeepSeek MLA) belongs to a

    separate task variant.

    '
provenance:
  added_in: v0.1
  authors:
  - triton-ascend-bench team
  last_modified: '2026-05-14'
  golden:
    oracle_kernel_equivalence: FAILED
    verified_at: '2026-05-27T13:53:50Z'
    tolerance_class_used: attention_flash
    equivalence_per_shape:
      P1:
        status: FAILED
        blocker: 'kernel returned non-tensor type: <class ''NoneType''>'
      P2:
        status: FAILED
        blocker: 'kernel returned non-tensor type: <class ''NoneType''>'
    golden_source: fallback_to_gpu_capture_pending
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - L >= 1
  - H >= 1
  - D >= 1
  dtypes:
    q: float32
    k: float32
    v: float32
    b_start_loc: int64
    b_seq_len: int64
  dists:
    q:
      kind: randn
    k:
      kind: randn
    v:
      kind: randn
    b_start_loc:
      kind: offsets
      args:
        to: B*L
    b_seq_len:
      kind: full
      args:
        value: L
  scalars:
    sm_scale:
      derive: 1/sqrt(D)
    is_causal: is_causal in [0, 1]
  tensor_invariants:
  - type: monotonic_nondecreasing
    args:
      input: b_start_loc
  - type: first_eq
    args:
      input: b_start_loc
      value: 0
  - type: last_eq
    args:
      input: b_start_loc
      value: B*L
