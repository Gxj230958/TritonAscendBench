param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - L >= 1
  - H >= 1
  - D >= 1
  dtypes:
    q: float32
    k: float32
    v: float32
    b_start_loc: int64
    b_seq_len: int64
  dists:
    q:
      kind: randn
    k:
      kind: randn
    v:
      kind: randn
    b_start_loc:
      kind: offsets
      args:
        to: B*L
    b_seq_len:
      kind: full
      args:
        value: L
  scalars:
    sm_scale:
      derive: 1/sqrt(D)
    is_causal: is_causal in [0, 1]
  tensor_invariants:
  - type: monotonic_nondecreasing
    args:
      input: b_start_loc
  - type: first_eq
    args:
      input: b_start_loc
      value: 0
  - type: last_eq
    args:
      input: b_start_loc
      value: B*L
