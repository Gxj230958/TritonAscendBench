interface:
  alias_map:
    q: ro
    k: ro
    v: ro
    o: wo_runner_allocated
    b_start_loc: ro
    b_seq_len: ro
    max_input_len: ro
    is_causal: ro
    sm_scale: ro
  mutability: in_place_output_buffer
  stride_layout: q/k/v/o contiguous [total_tokens, head, head_dim]
  workspace_policy: none
  stream_sync_policy: runner-managed
  rng_state_policy: deterministic
oracle:
  pytorch: oracle_pytorch.py::run
  gpu_triton: kernel.py::context_attention_fwd
tolerance_class: attention_flash
oracle_simplified: upstream_oracle_required
runner_checks:
  expected_kernel_count_range:
  - 1
  - 1
  min_dram_bytes: 524288
  min_flops: 33554432
  output_format: safetensors
  output_allocation: runner_allocated
  static_checks:
  - ast_denylist
  - import_allowlist
  - constexpr_match
  - cube_arithmetic_present
  - online_softmax_present
  metamorphic_checks:
  - name: qk_scale_inverse
    description: "Replacing (Q, K) with (\u03B1Q, K/\u03B1) for scalar \u03B1>0 leaves\
      \ output\nunchanged (q\xB7k product preserved exactly in fp32, modulo the\n\
      final cast).\n"
  - name: zero_v_yields_zero
    description: "v = 0 \u21D2 o = 0 regardless of q, k."
  - name: single_token_per_seq_equals_v
    description: "Every b_seq_len[i] = 1 \u21D2 softmax over a single logit = 1 \u21D2\
      \noutput equals v exactly.\n"
  shape_coverage:
    public: 6
    hidden: 5
is_canary: false
is_hidden_only: false
hardware:
  npu: 910b
  ub_budget_kb: 180
  fp8_required: false
  notes: "head_dim \u2264 128 at v0.1. Larger head_dim (DeepSeek MLA) belongs to a\n\
    separate task variant.\n"
provenance:
  added_in: v0.1
  authors:
  - triton-ascend-bench team
  last_modified: '2026-05-14'
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - L >= 1
  - H >= 1
  - D >= 1
  dtypes:
    q: float32
    k: float32
    v: float32
    b_start_loc: int64
    b_seq_len: int64
  dists:
    q:
      kind: randn
    k:
      kind: randn
    v:
      kind: randn
    b_start_loc:
      kind: offsets
      args:
        to: B*L
    b_seq_len:
      kind: full
      args:
        value: L
  scalars:
    sm_scale:
      derive: 1/sqrt(D)
    is_causal: is_causal in [0, 1]
  tensor_invariants:
  - type: monotonic_nondecreasing
    args:
      input: b_start_loc
  - type: first_eq
    args:
      input: b_start_loc
      value: 0
  - type: last_eq
    args:
      input: b_start_loc
      value: B*L
