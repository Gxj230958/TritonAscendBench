- id: H3
  name: h_deep
  knobs:
    B: 2
    L: 1024
    D: 64
    Dv: 64
    N: 512
    T: 512
    H: 8
    E: 2
    C: 100
    G: 6
- id: H4
  name: h_wide
  knobs:
    B: 8
    L: 32
    D: 64
    Dv: 48
    N: 128
    T: 16
    H: 8
    E: 4
    C: 20
    G: 4
- id: H5
  name: h_biggroup
  # kv_group_num = H/E = 20 > BLOCK_H (16): exercises the kernel's
  # block-based KV-head mapping cur_kv_head = cur_head_id //
  # cdiv(kv_group_num, BLOCK_H) (kernel.py:312/315), where the divisor
  # cdiv(20,16)=2 is > 1. With H/E <= 16 (every other shape) that divisor
  # is 1 and the mapping collapses to h // kv_group_num; this shape locks
  # in the genuine block-quantised mapping so a candidate correct only for
  # kv_group_num <= 16 fails. H=40 is a non-multiple of 16.
  knobs:
    B: 2
    L: 32
    D: 64
    Dv: 64
    N: 128
    T: 16
    H: 40
    E: 2
    C: 24
    G: 4
inputs:
  q:
    dims:
    - B
    - H
    - D
    dtype: float32
    dist: randn
  k_buffer:
    dims:
    - B*C
    - E
    - D
    dtype: float32
    dist: randn
  v_buffer:
    dims:
    - B*C
    - E
    - Dv
    dtype: float32
    dist: randn
  req_to_tokens:
    dims:
    - B*C
    dtype: int64
    dist: randperm
  b_seqlen:
    dims:
    - B
    dtype: int64
    dist: randint:1:C+1
  scale:
    derive: 1/sqrt(D)
  num_kv_splits:
    scalar: 4
