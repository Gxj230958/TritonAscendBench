# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Grouped
# (GQA) decode-attention stage-1: q [B, H, D] attends over paged latent KV
# k_buffer [B*C, E, D] / v_buffer [B*C, E, Dv] (E = H_KV, kv_group_num=H/E),
# gathered through req_to_tokens [B*C] (a non-identity slot permutation,
# page_size=1) for the first b_seqlen[b] cached tokens of each request, in
# NUM_KV_SPLITS contiguous splits. scale is the QK softmax scale 1/sqrt(D).
# Output att_out [B, H, NUM_KV_SPLITS, Dv+1] is the per-split partials.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - H >= 1
  - E >= 1
  - H % E == 0
  - H / E >= 2
  - D >= 1
  - Dv >= 1
  - C >= 1
  - G >= 1
  dtypes:
    q: float32
    k_buffer: float32
    v_buffer: float32
    req_to_tokens: int64
    b_seqlen: int64
  dists:
    q:
      kind: randn
    k_buffer:
      kind: randn
    v_buffer:
      kind: randn
    req_to_tokens:
      kind: randperm
    b_seqlen:
      kind: randint
      args:
        lo: '1'
        hi: C+1
  scalars:
    scale:
      derive: 1/sqrt(D)
    num_kv_splits: num_kv_splits == 4
  tensor_invariants: []
