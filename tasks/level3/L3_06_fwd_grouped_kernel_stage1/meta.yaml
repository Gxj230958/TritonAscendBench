cost_model:
  # Symbol audit (approach §3.4). Grouped (GQA) decode stage-1 attention
  # `_fwd_grouped_kernel_stage1`: per (batch, query-head, kv-split) it
  # scores q against the split's cached KV (qk = tl.dot, kernel.py:387),
  # runs an online softmax, and accumulates the context (tl.dot, line 427).
  # shapes.yaml binds:
  #   B  -> decode batch (q dim 0), H -> query head count H_Q (q dim 1,
  #   kernel BLOCK_H axis), E -> KV head count H_KV (k/v_buffer dim 1;
  #   kv_group_num = H/E), D -> QK head dim Lk (q dim 2 == k_buffer dim 2),
  #   Dv -> value head dim Lv (v_buffer dim 2 == att_out context width),
  #   C  -> max cached context length (req_to_tokens width; k/v_buffer hold
  #   B*C latent tokens). NUM_KV_SPLITS (att_out dim 2) is the fixed
  #   num_kv_splits scalar (4), not a size knob.
  # Both contractions are tl.dot (Cube unit on the 910B); flops_class is
  # the fused-flash class. Per (b, h) the kernel sweeps the full C context:
  # score qk = sum_D(q*k) over C -> 2*C*D, online softmax over C -> ~8*C,
  # context acc = sum_C(p*v) over Dv -> 2*C*Dv. Over B*H ->
  # B*H*(2*C*D + 2*C*Dv + 8*C). The NUM_KV_SPLITS partition only changes
  # how the C sweep is tiled, not the total work.
  # bytes(hbm): read q [B,H,D] + k_buffer [B*C,E,D] + v_buffer [B*C,E,Dv],
  # write att_out [B,H,G,Dv+1]; all float32 -> dtype_size. Aux index
  # tensors: req_to_tokens [B*C] int64 *8, b_seqlen [B] int64 *8.
  flops: B*H*(2*C*D + 2*C*Dv + 8*C)
  flops_class: fp16_cube
  bytes: (B*H*D + B*C*E*D + B*C*E*Dv + B*H*4*(Dv+1)) * dtype_size + B*C*8 + B*8
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
