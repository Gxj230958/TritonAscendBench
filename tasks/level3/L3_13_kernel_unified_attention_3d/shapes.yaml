inputs:
  q:
    dims:
    - E*L
    - H
    - D
    dtype: bfloat16
    dist: randn
  k:
    dims:
    - E*L
    - H
    - D
    dtype: bfloat16
    dist: randn
  v:
    dims:
    - E*L
    - H
    - D
    dtype: bfloat16
    dist: randn
  cu_seqlens_q:
    dims:
    - E+1
    dtype: int64
    dist: offsets:to=E*L
  seqused_k:
    dims:
    - E
    dtype: int64
    # KV length per sequence. The operator's domain invariant is
    # seqused_k == context_len + query_len (vLLM builds seq_lens =
    # num_computed_tokens + num_scheduled_tokens), so seqused_k >= query_len
    # always. Here cu_seqlens_q is offsets:to=E*L over E sequences, making
    # every query span exactly L, and the packed q/k/v carry exactly L KV
    # positions per sequence -- so the only in-domain, non-overrunning KV
    # length is L (full causal prefill, context_len == 0). A randint:1:L
    # would drive seqused_k < query_len, an out-of-domain regime where early
    # query rows have no causal key: the from-spec oracle softmaxes an all
    # -inf row to NaN while the frozen kernel skips that q-block's tile loop
    # and stores 0, a spurious mismatch the operator never exhibits upstream.
    dist: full:L
  softmax_scale:
    derive: 1/sqrt(D)
  causal:
    scalar: true
  out:
    dims:
    - E*L
    - H
    - D
    dtype: float16
  max_seqlen_q:
    scalar_knob: L
  max_seqlen_k:
    scalar_knob: L
  window_size:
    scalar_seq: [-1, -1]
  block_table:
    dims: [E, N]
    dtype: int32
    dist: "randint:0:E"
  softcap:
    scalar: 0.0
  q_descale: null
  k_descale: null
  v_descale: null

