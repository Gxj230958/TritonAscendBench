inputs:
  # FlashInfer paged-KV index gather (frozen kernel + flashinfer_backend.py
  # call site). req_to_token is the [max_batch, max_context_len] token-location
  # table; req_pool_indices selects the pool row per request; seq_lens (==
  # paged_kernel_lens) is the per-request copy length. E = batch size (bs) and
  # max_batch; N = max_context_len. seq_lens in [1, N-1] < N keeps every gather
  # inside its row (kv_start == 0 on the normal non-sliding host path).
  req_to_token:
    dims:
    - E
    - N
    dtype: int32
    dist: randint:0:N
  req_pool_indices:
    dims:
    - E
    dtype: int64
    dist: randint:0:E
  seq_lens:
    dims:
    - E
    dtype: int64
    dist: randint:1:N

explicit_view:
  P1:
    provenance: baseline
    tensors:
      req_to_token: '[4, 64] int32 axes=E,N dist=randint(lo=0, hi=N)'
      req_pool_indices: '[4] int64 axes=E dist=randint(lo=0, hi=E)'
      seq_lens: '[4] int64 axes=E dist=randint(lo=1, hi=N)'
  P2:
