inputs:
  # num_reqs = B (kernel grid extent). query_len = T (constant raw per-request
  # token span). max_num_reqs = B + G (> B, so the cudagraph tail padding is
  # exercised). These three scalars drive the launcher/oracle span layout.
  num_reqs:
    scalar_knob: B
  query_len:
    scalar_knob: T
  max_num_reqs:
    scalar_knob: B+G
  # Packed target token ids over total = B*T tokens (int32; values nonzero so a
  # missed shift store is visible). The kernel shifts these left by one within
  # each request span.
  target_input_ids:
    dims:
    - B*T
    dtype: int32
    dist: randint:1:1024
  # Packed target positions over total = B*T tokens (int64), copied verbatim
  # over each truncated span.
  target_positions:
    dims:
    - B*T
    dtype: int64
    dist: randint:0:N
  # req_idx -> req_state_idx remap (non-identity single-cycle permutation of
  # [0, B)), used to index last_sampled / next_prefill_tokens.
  idx_mapping:
    dims:
    - B
    dtype: int64
    dist: cyclic_perm
  # >0 selects the last_sampled branch, ==0 selects the chunked-prefill
  # next_prefill_tokens branch. window_pos:2 yields the alternating pattern
  # [0, 1, 0, 1, ...], so BOTH branches are guaranteed exercised in every shape
  # (B >= 2) -- a kernel that took the wrong branch is always discriminated.
  num_sampled:
    dims:
    - B
    dtype: int32
    dist: window_pos:2
  # Rejected token count per request, in [0, T) (torch.randint hi is exclusive)
  # so the truncated query length T - num_rejected stays >= 1.
  num_rejected:
    dims:
    - B
    dtype: int32
    dist: randint:0:T
  # Candidate next tokens, indexed by req_state_idx; length max_num_reqs (int32).
  last_sampled:
    dims:
    - B+G
    dtype: int32
    dist: randint:1:1024
  next_prefill_tokens:
    dims:
    - B+G
    dtype: int32
    dist: randint:1:1024
  # Per-request target sequence lengths, copied into eagle_seq_lens[:num_reqs].
  seq_lens:
    dims:
    - B
    dtype: int32
    dist: randint:1:N
