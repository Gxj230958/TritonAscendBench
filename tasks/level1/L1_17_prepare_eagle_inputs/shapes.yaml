# Operator-family knob grid for the spec_decode EAGLE input-prep kernel.
# num_reqs = B (the grid extent, one program per request); query_len = T (the
# constant raw per-request token span, so total tokens = B*T); max_num_reqs =
# B + G > B (exercises the cudagraph tail padding). All rows keep B >= 2 (a
# non-identity idx_mapping permutation) and T >= 2 (a non-trivial shift/reject
# span).
size_knobs:
  B: 16
  L: 256
  D: 512
  Dv: 512
  N: 512
  T: 8
  H: 16
  E: 16
  C: 32
  G: 8
