inputs:
  masked_m:
    dims:
    - E
    dtype: int64
    dist: randint:0:T
  # n / k vary per shape so the grader discriminates the scalar GEMM dims:
  # a launcher that hard-codes them (instead of reading inputs) mismatches.
  # Knobs keep 2*n, n, k pairwise distinct on every shape (2*H < N, H != N).
  n:
    derive: "H"
  k:
    derive: "N"
  num_experts:
    scalar_knob: E
  problem_sizes1:
    dims:
    - E
    - "3"
    dtype: int32
  x:
    dims:
    - B
    - N
    - D
    dtype: float16
    dist: randn
  input:
    dims:
    - B
    - N
    - D
    dtype: float16
    dist: randn
