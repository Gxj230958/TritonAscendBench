# FlashMLA paged-KV page-index inputs (kernel.py::create_flashmla_kv_indices_triton).
# req_to_token [E, L] is the token-slot table (E pool rows, L = max context len);
# req_pool_indices [E] selects a pool row per request; page_kernel_lens [E] is the
# per-request seq_len. page_size is the PAGED_SIZE constexpr (page granularity).
- id: H5
  name: edge_CPU-valid; pending 
  knobs:
    E: 1
    L: 1
- id: H6
  name: edge_CPU-valid; pending 
  knobs:
    E: 1
    L: 320
- id: H7
  name: edge_CPU-valid; pending 
  knobs:
    E: 1
    L: 16384
- id: H8
  name: edge_CPU-valid; pending 
  knobs:
    E: 256
    L: 1
- id: H9
  name: edge_CPU-valid; pending 
  knobs:
    E: 256
    L: 16384
inputs:
  req_to_token:
    dims:
    - E
    - L
    dtype: int32
    dist: randint:0:N
  req_pool_indices:
    dims:
    - E
    dtype: int32
    dist: randint:0:E
  page_kernel_lens:
    dims:
    - E
    dtype: int32
    dist: randint:1:L
  page_size:
    scalar: 16

