inputs:
  # Raw token->expert assignment (one entry per token-topk slot). The launcher
  # and oracle both sort topk_ids.view(-1) (the upstream preprocessing slice)
  # before driving the kernel, so values span [0, num_local_experts) to give a
  # non-trivial segment indptr. Matches moe_ep_deepgemm_preprocess's topk_ids.
  topk_ids:
    dims:
    - B
    - D
    dtype: int64
    dist: randint:0:E
  # num_local_experts: grid is (num_local_experts + 1,) and seg_indptr has
  # length num_local_experts + 1 (kernel.py moe_ep_deepgemm_preprocess).
  num_local_experts:
    scalar_knob: E

explicit_view:
  P1:
    provenance: baseline
    tensors:
      topk_ids: '[8, 64] int64 axes=B,D dist=randint(lo=0, hi=E)'
    params:
      num_local_experts: 4
  P2:
