# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Min-p logit filtering: each row of logits [B, N] is masked by a per-request min_p [E] threshold, routed via expanded_idx_mapping [B] (token->request id in [0, E)). min_p is a probability in [0, 1).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - N >= 2
  - E >= 1
  dtypes:
    logits: float32
    expanded_idx_mapping: int64
    min_p: float32
  dists:
    logits:
      kind: randn
    expanded_idx_mapping:
      kind: randint
      args:
        lo: '0'
        hi: E
    min_p:
      kind: rand
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: expanded_idx_mapping
      value: E
