# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Builds the FlashMLA paged-KV page-index table from a req_to_token slot table [E, L], per-request pool rows req_pool_indices [E], and per-request seq_lens page_kernel_lens [E]. page_size is the PAGED_SIZE page granularity; page_kernel_lens >= 1; req_pool_indices index the E rows of req_to_token.
param_constraints:
  scaffold: false
  dims:
  - E >= 1
  - L >= 1
  dtypes:
    req_to_token: int32
    req_pool_indices: int32
    page_kernel_lens: int32
  dists:
    req_to_token:
      kind: randint
      args:
        lo: '0'
        hi: N
    req_pool_indices:
      kind: randint
      args:
        lo: '0'
        hi: E
    page_kernel_lens:
      kind: randint
      args:
        lo: '1'
        hi: L
  scalars:
    page_size: page_size >= 1
  tensor_invariants:
  - type: index_in_range
    args:
      input: req_pool_indices
      value: E
