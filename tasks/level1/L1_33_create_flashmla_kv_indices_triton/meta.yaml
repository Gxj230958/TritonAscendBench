cost_model:
  # Symbol audit (approach §3.4). FlashMLA paged-KV page-index construction
  # (kernel.py::create_flashmla_kv_indices_triton). For each request the
  # kernel walks req_to_token at page_size stride and emits page id
  # (token_slot // page_size) for each occupied page. Symbol map:
  # E -> n_reqs (req_pool_indices / page_kernel_lens length, kernel grid
  # extent), N -> max pages per request = ceil(L / page_size) (the
  # per-request copy ceiling). page_size is a scalar literal.
  # FLOPs (vector): per page a cdiv + a floor-div (~2 integer ops) over up
  # to E*N pages -> ~2*E*N integer ops; no floating-point work. Dominant
  # cost is bytes.
  # bytes (hbm): all tensors are int32 (dtype_size=4). Reads: gathered
  # req_to_token slots up to E*N + req_pool_indices[E] + page_kernel_lens[E].
  # Writes: kv_indices up to E*N. -> (E*N + E + E + E*N)*4 = (2*E*N + 2*E)*4.
  flops: 2*E*N
  flops_class: vector
  bytes: (2*E*N + 2*E)*4
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
