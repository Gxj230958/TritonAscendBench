cost_model:
  # Symbol audit (approach §3.4). Qwen2-VL multimodal RoPE: apply rotate_half
  # RoPE rot' = rot*cos + rotate_half(rot)*sin to the first rotary_dim dims of
  # every head of q and k. One program per token. Symbol map: B -> n_tokens
  # (q/k dim 0, cos/sin dim 1, kernel grid extent), H -> n_qh (q dim 1 is
  # H*head_size with head_size=16, so q carries H heads; k carries 1 head over
  # its 16-wide inner axis). head_size / rotary_dim / mrope_section are scalar
  # literals (16 / 16 / [3,3,2]).
  # FLOPs (vector): per rotary element rot*cos + rotate_half*sin ~= mul + mul +
  # add + the rotate-half negate ~= 4 ops; over the (H+1) heads (H from q, 1
  # from k) of rotary_dim=16 each, per token -> 4*B*(H+1)*16 = 64*B*(H+1).
  # bytes (hbm): read q[B,H*16] + k[B,16] + cos[3,B,8] + sin[3,B,8], write
  # q[B,H*16] + k[B,16] -> (2*B*16*H + 2*B*16 + 2*3*B*8) elements; all float32
  # primary family -> dtype_size.
  flops: 64*B*(H+1)
  flops_class: vector
  bytes: (32*B*H + 32*B + 48*B) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
