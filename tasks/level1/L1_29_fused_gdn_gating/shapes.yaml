inputs:
  # Upstream contract (fused_gdn_gating): A_log / dt_bias are per-head [D]
  # 1-D parameters broadcast over the batch; a / b are [B, D] token tensors.
  A_log:
    dims:
    - D
    dtype: float32
    dist: randn
  a:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  b:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  dt_bias:
    dims:
    - D
    dtype: float32
    dist: randn
  beta:
    scalar: 1.0
  threshold:
    scalar: 20.0
