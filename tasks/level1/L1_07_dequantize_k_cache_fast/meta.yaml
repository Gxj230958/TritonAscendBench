# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Dequantises the MLA K cache from a single packed fp8 row quant_k_cache [B, 656] (float8_e4m3fn). Internally unpacked by byte reinterpret: nope_q fp8 [B, 512], nope_s fp32-view [B, 4] (per-128-group scales), rope bf16-view [B, 64]. The nope half is per-group dequantised (out[:, j] = nope_q[:, j] * nope_s[:, j // 128]); the rope half is passed through. dim_quant == 656 and group_size == 128 are structural invariants asserted by the kernel.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  dtypes:
    quant_k_cache: float8_e4m3fn
  dists:
    quant_k_cache:
      kind: randn
  scalars: {}
  tensor_invariants: []
