cost_model:
  # Symbol audit (approach §3.4). Single-pass LayerNorm with affine:
  # mean/var normalise along the hidden dim then scale + shift. One
  # program per row. Symbol map: B -> x rows (x dim 0, kernel grid
  # extent), D -> hidden size (x dim 1 == weight/bias length, per-row
  # reduction extent). eps is a scalar literal. The upstream kernel has
  # no residual add; its optional second branch is the gating tensor z
  # (Z=None here).
  # FLOPs (vector): ~8-op LayerNorm body -> ~8*B*D.
  # bytes (hbm): read x[B,D] + weight[D] + bias[D], write output[B,D]
  # -> (2*B*D + 2*D) elements; all float32 primary family -> dtype_size.
  flops: 8*B*D
  flops_class: vector
  bytes: (2*B*D + 2*D) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: upstream_oracle_required
