# Operator input contract (WA.1, specs/task_api_contract.md §5.2). SiLU-gated mul + fp8 group quant for DeepGEMM: y [E, T, 2*D] is split on the last axis into gate/value halves; tokens_per_expert [E] is the per-expert token count. group_size is the quant group; fp8_max the fp8 saturation bound.
param_constraints:
  scaffold: false
  dims:
  - E >= 1
  - T >= 1
  # The kernel's H == D (y last dim is 2*D) must be a multiple of
  # group_size == 128: G = H // 128 groups, grid = (E * G,), and each
  # program loads a full BLOCK == 128 column tile, so a non-multiple
  # D reads/writes out of bounds.
  - D >= 128
  - D % 128 == 0
  dtypes:
    y: float32
    tokens_per_expert: int64
  dists:
    y:
      kind: randn
    tokens_per_expert:
      kind: randint
      args:
        lo: '0'
        hi: T
  scalars:
    # The Triton-fallback kernel asserts group_size == 128 (BLOCK == 128).
    group_size: group_size == 128
    fp8_max: 0 < fp8_max <= 1e4
  tensor_invariants: []
