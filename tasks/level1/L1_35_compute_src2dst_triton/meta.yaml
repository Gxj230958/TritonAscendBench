# Operator input contract (WA.1, specs/task_api_contract.md §5.2). compute_src2dst builds the inverse MoE token permutation: src2dst[reorder_ids[i]] = i. reorder_ids must be a valid permutation of [0, num_toks); the `arange` dist materialises exactly 0..B-1. num_toks is the token count (= B).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  dtypes:
    reorder_ids: int64
  dists:
    reorder_ids:
      kind: arange
  scalars:
    num_toks: num_toks >= 1
  tensor_invariants:
  - type: index_in_range
    args:
      input: reorder_ids
      value: B
