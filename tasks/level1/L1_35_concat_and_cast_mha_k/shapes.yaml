# Operator: DeepSeek-V3 MLA K assembly (concat_and_cast_mha_k).
# Real upstream contract (sglang/srt/layers/attention/utils.py +
# sarvam_moe.py / forward_mha.py call sites):
#   k_nope : [B, H, Dn]  per-head nope part   (B = n_tokens, H = num_local_heads)
#   k_rope : [B, 1, Dr]  shared rope part, broadcast across the H heads
#   k      : [B, H, Dn + Dr] = empty(out_dtype); written by the kernel
# The frozen @triton.jit kernel uses tl.arange(0, H/Dn/Dr) with no masking,
# so H, Dn and Dr must all be powers of two; Dn + Dr need not be.
size_knobs:
  B: 512
  H: 16
  Dn: 128
  Dr: 64
