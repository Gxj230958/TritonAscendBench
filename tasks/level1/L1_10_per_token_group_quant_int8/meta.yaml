# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Per-token group int8 quantisation: x [B, D] is split into D/group_size groups along D, each group quantised by its own scale. group_size is fixed at 8 here, so D must be a multiple of 8. eps is the scale-divide floor.
param_constraints:
  scaffold: false
  dims:
  - D % 8 == 0
  - D >= 8
  - B >= 1
  dtypes:
    x: float32
  dists:
    x:
      kind: randn
  scalars:
    group_size: group_size == 8
    eps: 0 < eps <= 1e-2
  tensor_invariants: []
