cost_model:
  # Symbol audit. Gumbel-max sampler: per (token, vocab) element on the noisy
  # path the kernel runs a Philox draw (10 rounds of integer mix) + a fp64
  # double-log gumbel transform + add, then a block argmax. Symbol map:
  # T -> num_tokens (grid dim 0), V -> vocab_size (the reduced inner axis).
  # FLOPs (vector): ~20 ops per element for the Philox 4x32-10 round mix and the
  # -log(-log(u)) transform + temperature divide + max-reduce -> ~20*T*V.
  # bytes (hbm): read logits[T, V] fp32 (4 bytes); the local_argmax/local_max
  # partials are O(T * ceil(V/1024)) << T*V -> dominated by the logits read.
  flops: 20*T*V
  flops_class: vector
  bytes: T*V * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
param_constraints:
  scaffold: false
  dims:
  - T >= 1
  - V >= 1
  - R >= 1
  dtypes:
    logits: float32
    expanded_idx_mapping: int64
    temperature: float32
    seed: int64
    pos: int64
  dists:
    logits:
      kind: randn
    expanded_idx_mapping:
      kind: gumbel_routing
      args:
        R: R
    temperature:
      kind: gumbel_temps
    seed:
      kind: randint
      args:
        lo: '0'
        hi: '2147483647'
    pos:
      kind: randint
      args:
        lo: '0'
        hi: '1024'
  scalars:
    # Pinned to 1 (True): the shapes drive apply_temperature=True, the richer
    # path that exercises BOTH temperature scaling and gumbel noise. The
    # apply_temperature=False branch only skips the scale (noise still applies),
    # a strict subset of the True path.
    apply_temperature: apply_temperature == 1
  tensor_invariants:
  - type: index_in_range
    args:
      input: expanded_idx_mapping
      value: R
