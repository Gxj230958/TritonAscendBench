cost_model:
  # Symbol audit (approach §3.4). EAGLE draft input prep: one program per
  # request (grid extent B == num_reqs) shifts the packed target_input_ids
  # left by one over each request's truncated query span, copies positions,
  # and writes per-request metadata. Symbol map: B -> num_reqs (kernel grid
  # extent), T -> query_len (the per-request token span). Total packed tokens
  # = B*T, the dominant memory-traffic extent.
  # FLOPs (vector): per token a handful of integer index/add ops over B*T
  # tokens -> no floating-point arithmetic; reported as the small constant
  # 4*B*T.
  # bytes (hbm), mixed-dtype rule (approach §3.2): int32 primary family
  # (target_input_ids declared first). Upper bound over the full packed extent
  # B*T (the kernel touches only each request's truncated span T-num_rejected,
  # so actual traffic is sum(T-num_rejected) <= B*T). The kernel reads
  # target_input_ids and writes eagle_input_ids (int32 -> 4 bytes each) and
  # reads target_positions / writes eagle_positions (int64 -> 8 bytes each):
  # (2*4 + 2*8)*B*T = 24*B*T. Per-request metadata (idx_mapping, num_sampled,
  # num_rejected, seq_lens, query_start_loc, eagle_seq_lens, last_token_indices)
  # adds a small O(B) term, negligible vs B*T.
  flops: 4*B*T
  flops_class: vector
  bytes: 24*B*T
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
