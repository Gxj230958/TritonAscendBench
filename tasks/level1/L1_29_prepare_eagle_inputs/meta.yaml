# Operator input contract (WA.1, specs/task_api_contract.md §5.2). EAGLE
# speculative-decoding draft input prep: one program per request (grid B ==
# num_reqs) shifts the packed target_input_ids left by one over each request's
# truncated query span (length T - num_rejected), overwrites the last slot with
# the next sampled / prefill token, copies positions, and writes per-request
# metadata (last_token_indices, eagle_query_start_loc, eagle_seq_lens) plus a
# cudagraph pad tail out to max_num_reqs.
param_constraints:
  scaffold: false
  dims:
  - B >= 2
  - T >= 2
  - G >= 1
  dtypes:
    target_input_ids: int32
    target_positions: int64
    idx_mapping: int64
    num_sampled: int64
    num_rejected: int64
    last_sampled: int32
    next_prefill_tokens: int32
    seq_lens: int32
  dists:
    target_input_ids:
      kind: randint
      args:
        lo: '1'
        hi: '1024'
    target_positions:
      kind: randint
      args:
        lo: '0'
        hi: N
    idx_mapping:
      kind: cyclic_perm
      args: {}
    num_sampled:
      kind: window_pos
      args:
        W: '2'
    num_rejected:
      kind: randint
      args:
        lo: '0'
        hi: T
    last_sampled:
      kind: randint
      args:
        lo: '1'
        hi: '1024'
    next_prefill_tokens:
      kind: randint
      args:
        lo: '1'
        hi: '1024'
    seq_lens:
      kind: randint
      args:
        lo: '1'
        hi: N
  scalars:
    num_reqs: num_reqs >= 2
    query_len: query_len >= 2
    max_num_reqs: max_num_reqs > B
  tensor_invariants:
  # num_rejected in [0, T) -> truncated query length T - num_rejected stays >= 1.
  - type: index_in_range
    args:
      input: num_rejected
      value: T
  # idx_mapping is a permutation of [0, num_reqs), so every entry is in range.
  - type: index_in_range
    args:
      input: idx_mapping
      value: B
