cost_model:
  # Symbol audit (approach §3.4). Per-expert segment offsets: count how many
  # topk_ids fall in each expert, then prefix-sum into indptr. Symbol map:
  # B -> topk_ids dim 0 (token rows), D -> topk_ids dim 1 (topk per token);
  # the [B,D] selection matrix is histogrammed. num_experts is a scalar literal
  # (4); the output indptr has num_experts+1 entries.
  # FLOPs (vector): one bincount increment per selection entry plus the
  # cumsum — pure integer arithmetic, ~2*B*D int ops; no floating-point work.
  # bytes (hbm), mixed-dtype rule (approach §3.2): int64 primary family
  # (topk_ids) -> dtype_size=8 for the read topk_ids[B,D] -> B*D*dtype_size.
  # indptr (~5 entries: num_experts+1) is int32 (oracle allocs torch.int32,
  # non-primary dtype) -> literal byte width *4 -> + 5*4.
  flops: 2*B*D
  flops_class: vector
  bytes: B*D*dtype_size + 5*4
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
