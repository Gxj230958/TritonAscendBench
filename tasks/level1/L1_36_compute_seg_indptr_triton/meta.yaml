# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Computes the per-expert segment indptr from topk_ids [B, D] (each entry an expert id). num_experts is the expert count.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - D >= 1
  dtypes:
    topk_ids: int64
  dists:
    topk_ids:
      kind: randint
      args:
        lo: '0'
        hi: '2'
  scalars:
    num_experts: num_experts >= 1
  tensor_invariants: []
