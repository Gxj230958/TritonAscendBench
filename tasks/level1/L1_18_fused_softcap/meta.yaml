# Operator input contract (WA.1, specs/task_api_contract.md §5.2). fused_softcap applies cap*tanh(x/cap) elementwise over [B, D]. cap is the softcap ceiling — strictly positive (vLLM/SGLang use ~30-50); cap<=0 would bypass the cap.
param_constraints:
  scaffold: false
  dims:
  - D >= 1
  - B >= 1
  dtypes:
    x: float32
  dists:
    x:
      kind: randn
  scalars:
    cap: 0 < cap <= 1e3
  tensor_invariants: []
