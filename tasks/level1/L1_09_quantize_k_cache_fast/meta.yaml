cost_model:
  # Symbol audit (approach §3.4). Inverse of L1_07: per-tile symmetric FP8
  # quant of the nope part — s = amax(|tile|)/fp8_max; q = clamp(tile/s) cast
  # to fp8; rope passthrough. Symbol map: B -> token rows (num_tokens, k_nope
  # dim 0, kernel grid dim 0), D -> DIM_NOPE == 512 (k_nope last dim). The rope
  # width DIM_ROPE == 64 and group_size == 128 are upstream-fixed literals;
  # output nope_s has D//128 = 4 columns per token.
  # FLOPs (vector): per nope element ~ abs + tile-amax reduction + divide +
  # clamp ~= 4 ops -> ~4*B*D; the rope half is a pure copy.
  # bytes (hbm): bfloat16 primary family (k_nope declared first) -> dtype_size=2.
  # bf16-width terms: read k_nope[B,D] + read k_rope[B,64] + write rope[B,64]
  # bf16 passthrough -> (B*D + 2*B*64)*dtype_size. nope_s[B,D/128] fp32 scale ->
  # + 4*B*(D/128) bytes. nope_q[B,D] float8_e4m3fn quant output (non-primary
  # dtype, approach §3.2) -> literal byte width *1 -> + B*D.
  flops: 4*B*D
  flops_class: vector
  bytes: (B*D + 2*B*64)*dtype_size + 4*B*(D/128) + B*D
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
