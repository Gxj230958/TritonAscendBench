# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Quantises the
# MLA K cache exactly as the frozen SGLang kernel (commit 409d350): k_nope
# [B, 512] bfloat16 is group-quantised in tiles of group_size=128 (4 tiles) to
# float8_e4m3fn with per-tile scales s = amax(|tile|)/fp8_max; k_rope [B, 64]
# bfloat16 is passed through unchanged. The kernel hard-asserts dim_nope==512,
# dim_rope==64, group_size==128, bfloat16 inputs; B (num_tokens) is the only
# free axis. fp8_max is the fp8_e4m3fn saturation bound (448.0).
param_constraints:
  scaffold: false
  dims:
  - D == 512
  - B >= 1
  dtypes:
    k_nope: bfloat16
    k_rope: bfloat16
  dists:
    k_nope:
      kind: randn
    k_rope:
      kind: randn
  scalars:
    group_size: group_size == 128
    fp8_max: 0 < fp8_max <= 1e4
  tensor_invariants: []
