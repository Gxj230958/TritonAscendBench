# Upstream contract (SGLang _quantize_k_cache_fast_kernel, commit 409d350):
# the kernel hard-asserts dim_nope == 512, dim_rope == 64, group_size == 128,
# bfloat16 inputs. The only free axis is the token count B (num_tokens =
# grid dim 0). D mirrors DIM_NOPE (512) so the cost model resolves; the
# per-input dims pin the fixed nope/rope widths as literals.
size_knobs:
  B: 64
  D: 512
public_shapes:
- id: P1
  name: tiny
  knobs:
    B: 4
    D: 512
- id: P2
  name: small
  knobs:
    B: 16
    D: 512
- id: P3
  name: medium
  knobs:
    B: 64
    D: 512
- id: P4
  name: large
  knobs:
    B: 256
    D: 512
- id: P5
  name: wide
  knobs:
    B: 1024
    D: 512
- id: P6
  name: scale_CPU-valid; pending
  knobs:
    B: 3072
- id: P7
  name: scale_CPU-valid; pending
  knobs:
    B: 4096
hidden_shapes:
- id: H1
  name: h_singleton
  knobs:
    B: 1
    D: 512
- id: H2
  name: h_odd
  knobs:
    B: 37
    D: 512
- id: H3
  name: h_deep
  knobs:
    B: 2048
    D: 512
- id: H4
  name: h_wide
  knobs:
    B: 512
    D: 512
inputs:
  k_nope:
    dims:
    - B
    - 512
    dtype: bfloat16
    dist: randn
  k_rope:
    dims:
    - B
    - 64
    dtype: bfloat16
    dist: randn
  group_size:
    scalar: 128
  fp8_max:
    scalar: 448.0
