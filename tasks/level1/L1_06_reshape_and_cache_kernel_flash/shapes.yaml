inputs:
  key:
    dims:
    - B
    - H
    - D
    dtype: bfloat16
    dist: randn
  value:
    dims:
    - B
    - H
    - D
    dtype: bfloat16
    dist: randn
  key_cache:
    dims:
    - C
    - T
    - H
    - D
    dtype: bfloat16
    dist: randn
  value_cache:
    dims:
    - C
    - T
    - H
    - D
    dtype: bfloat16
    dist: randn
  slot_mapping:
    dims:
    - B
    dtype: int64
    # Unique slots spanning the full paged-cache capacity C*T (block_size=T,
    # C blocks). randint:0:C only ever hit block 0 and could collide, leaving
    # the kernel's block_idx = slot // T addressing untested and creating an
    # ill-defined duplicate-scatter race against the oracle.
    dist: offsets:to=C*T-1
  kv_cache_dtype:
    scalar: auto
  k_scale:
    dims:
    - 1
    dtype: bfloat16
    dist: rand
  v_scale:
    dims:
    - 1
    dtype: float32
    dist: rand

