interface:
  alias_map:
    hidden_states: ro
    output: wo_candidate_allocated
  mutability: no_inplace
  stride_layout: hidden_states.contiguous() required, last dim even
  workspace_policy: none
  stream_sync_policy: runner-managed
  rng_state_policy: deterministic
oracle:
  pytorch: oracle_pytorch.py::run
  gpu_triton: kernel.py::silu_and_mul_triton
tolerance_class: elementwise
# Operator input contract (WA.1, specs/task_api_contract.md §5.2). silu_and_mul
# takes a single [B, 2*D] tensor: the kernel splits it into halves x1 / x3 on
# the last axis, so the inner dim must be even (2*D is even by construction).
# Hand-reconciled WA.1 sample task.
cost_model:
  # Symbol audit (approach §3.4). silu_and_mul_kernel launches one program per
  # row (grid = bs = B) and each program processes hidden_dim = D output
  # columns. Symbol map: B -> bs (grid extent, hidden_states dim 0),
  # D -> hidden_dim (output dim 1 == half of the input's 2*D inner axis).
  # FLOPs (vector): elementwise over B*D output elements; per element
  # silu(x1)=x1*sigmoid(x1) costs ~1 sigmoid (neg+exp+add+recip ~= 4) + 1 mul,
  # then the gate `* x3` is 1 mul -> ~6 ops -> 6*B*D.
  # bytes (hbm): read hidden_states [B, 2*D] (2*B*D) + write output [B, D]
  # (B*D) -> 3*B*D; single float32 primary family -> dtype_size.
  flops: 6*B*D
  flops_class: vector
  bytes: 3*B*D*dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
param_constraints:
  scaffold: false
  dims:
    # The fused gate splits the last axis into two equal halves.
    - "D >= 4"
    - "B >= 1"
  dtypes:
    hidden_states: float32
  dists:
    hidden_states: {kind: randn}
  scalars: {}
  tensor_invariants: []
oracle_simplified: simple_pytorch_ok
runner_checks:
  expected_kernel_count_range:
  - 1
  - 1
  min_dram_bytes: 65536
  min_flops: 262144
  output_format: safetensors
  output_allocation: candidate_allocated
  static_checks:
  - ast_denylist
  - import_allowlist
  - constexpr_match
  metamorphic_checks:
  - name: zero_x1_yields_zero
    description: x1 all zeros ⇒ output is zero everywhere (silu(0)=0).
  - name: linear_x3_scaling
    description: scaling x3 by k scales output by k exactly.
  shape_coverage:
    public: 5
    hidden: 3
is_canary: false
is_hidden_only: false
hardware:
  npu: 910b
  ub_budget_kb: 48
  fp8_required: false
provenance:
  added_in: v0.1
  authors:
  - triton-ascend-bench team
