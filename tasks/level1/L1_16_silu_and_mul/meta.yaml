name: silu_and_mul_kernel
repo: SGLang
dtype_class: VV
category: elementwise
npu_difficulty: low
upstream:
  repo: sgl-project/sglang
  path: python/sglang/srt/layers/elementwise.py
  commit_sha: snapshot-no-git
  file_sha256: 5e0bf53718d4ab671a449fbd96c11b3bb4a4b44ccde4606a684058696c2e3f64
  function_hash: 5e0bf53718d4ab671a449fbd96c11b3bb4a4b44ccde4606a684058696c2e3f64
