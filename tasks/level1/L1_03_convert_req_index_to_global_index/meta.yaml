# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Converts per-request token indices to global KV indices: req_id [B] (request id in [0, E)), block_table [E, N], token_indices [E, L]. block_size is the KV page size.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - E >= 1
  - N >= 1
  - L >= 1
  dtypes:
    req_id: int32
    block_table: int32
    token_indices: int32
  dists:
    req_id:
      kind: randint
      args:
        lo: '0'
        hi: E
    block_table:
      kind: randint
      args:
        lo: '0'
        hi: N
    token_indices:
      kind: randint
      args:
        lo: '0'
        hi: N
  scalars:
    block_size: block_size >= 1
  tensor_invariants:
  - type: index_in_range
    args:
      input: req_id
      value: E
