cost_model:
  # Constrained decoding: bitmask row i masks logits[logits_indices[i]],
  # zeroing (-> -inf) vocab positions whose bit is 0. One program per bitmask
  # row. B -> n_tokens (logits dim 0), N -> vocab (logits dim 1), E ->
  # num_masks (bitmask dim 0, == len(logits_indices), each -> a logits row).
  # FLOPs: pure bit extraction + -inf masking, no float arithmetic; reported as
  # the small constant 2*E. Dominant cost is bytes (hbm), primary family float32
  # logits: read+write logits[B,N] -> 2*B*N; int32 logits_indices[E] -> 4*E;
  # int32 bitmask[E,N/32+1] -> 4*E*(N/32+1).
  flops: 2*E
  flops_class: vector
  bytes: 2*B*N*dtype_size + 4*E + 4*E*(N/32+1)
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
