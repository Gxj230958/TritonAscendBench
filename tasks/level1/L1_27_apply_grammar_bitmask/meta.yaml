# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Applies a structured-decoding grammar bitmask to logits [B, N]. bitmask [E, N//32+1] packs 32 vocab bits per int word; logits_indices [E] maps each bitmask row to its logits row (values in [0, B), E <= B).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - N >= 2
  - E >= 1
  - E <= B
  dtypes:
    logits: float32
    logits_indices: int32
    bitmask: int32
  dists:
    logits:
      kind: randn
    logits_indices:
      kind: arange
    bitmask:
      kind: randint
      args:
        lo: '0'
        hi: '1024'
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: logits_indices
      value: E
