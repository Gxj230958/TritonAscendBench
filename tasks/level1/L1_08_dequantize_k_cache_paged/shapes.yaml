# Frozen upstream contract (SGLang ``dequantize_k_cache_paged``): the
# entrypoint consumes ONE packed fp8 K-cache row tensor
# ``quant_k_cache[C, 656]`` (dtype float8_e4m3fn) plus a flattened paged
# index ``page_table_1_flattened[B]`` (int64). The kernel reshapes
# quant_k_cache to ``[-1, 656]`` (C physical cache rows), then for each of
# the B output tokens gathers the physical row
# ``token_id_paged = page_table_1_flattened[token_id]`` and dequantises it.
# The 656 byte-lanes of each gathered row are unpacked internally by slice +
# byte reinterpret (nope_q fp8 [.,512], nope_s fp32-view [.,4], rope bf16-view
# [.,64]); ``dim_quant == 656`` and ``group_size == 128`` are structural
# invariants asserted by the kernel. The only free knobs are C (the physical
# cache-row count) and B (the gathered token count). group_size is the
# entrypoint default (128), not a shape input.
#
# Index invariant: page_table_1_flattened indexes into the C physical rows,
# so values are randint in [0, C). B may differ from C (prefix sharing lets
# multiple output tokens map to the same physical row) and is exercised both
# >= C and < C across the shape rows below.
size_knobs:
  B: 8
  C: 8
