# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Paged K-cache dequant from a single packed fp8 tensor quant_k_cache reshaped to [C, 656] (float8_e4m3fn, C physical cache rows). page_table_1_flattened [B] (int64, indices in [0, C)) gathers one physical row per output token. Each gathered row unpacks by byte reinterpret: nope_q fp8 [.,512], nope_s fp32-view [.,4] (per-128-group scales), rope bf16-view [.,64]. The nope half is per-group dequantised (out[:, j] = nope_q[:, j] * nope_s[:, j // 128]); the rope half is passed through. dim_quant == 656 and group_size == 128 are structural invariants asserted by the kernel.
param_constraints:
  scaffold: false
  dims:
  - C >= 1
  - B >= 1
  dtypes:
    quant_k_cache: float8_e4m3fn
    page_table_1_flattened: int64
  dists:
    quant_k_cache:
      kind: randn
    page_table_1_flattened:
      kind: randint
      args:
        lo: '0'
        hi: C
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: page_table_1_flattened
      value: C
