cost_model:
  # Paged MLA K-cache dequant (packed). Input quant_k_cache reshapes to
  # [C, 656] fp8 (C physical cache rows); page_table_1_flattened[B] int64
  # gathers one physical row per output token. Each gathered 656-byte row
  # unpacks to nope_q fp8 [.,512] + nope_s fp32-view [.,4] + rope bf16-view
  # [.,64]; output[B, 1, 576] bf16 = concat(dequant_nope, rope). Only B (the
  # gathered token count) and C (the physical cache-row count) are free
  # (656/512/64/128 are structural kernel asserts).
  # FLOPs (vector): one multiply per nope element over the B gathered rows ->
  # B*512; rope half is a pure copy (0). The per-row gather index math is O(1).
  # bytes (hbm): gather B rows of 656 fp8 bytes/token, write 576 bf16 (2B)
  # per token -> B*656 + B*576*2 K-cache primary-family bytes.
  # page_table_1_flattened[B] is an int64 index tensor (non-primary, approach
  # §3.2): B int64 elements -> literal *8, billed separately.
  flops: B*512
  flops_class: vector
  bytes: B*656 + B*576*2 + B*8
  bytes_resource: hbm
