# Operator-family knob grid (WB.1 R2-3): values reflect
# the ssm family's real axes — not the legacy
# uniform template. See docs/plans/2026-05-21-operator-param-validity-impl.md.
#
# Graded contract: dt[T, H] (T = seqlen, H = nheads), A[H], chunk_size = 16.
# cu_chunk_seqlens is derived (non-uniform, chunk-aligned) by the launcher and
# the oracle from the SAME (T, chunk_size). Every shape uses T >= 25 with
# chunk_size = 16 so the genuine non-uniform chunk count differs from a uniform
# ceil(T / 16) split (segmentation is load-bearing on every graded shape) and
# nchunks >= 2 (the per-chunk cumsum reset is exercised everywhere).
size_knobs:
  B: 8
  L: 128
  D: 128
  Dv: 128
  N: 64
  T: 128
  H: 16
  E: 8
  C: 16
  G: 8
  DTSP: 0
