cost_model:
  # Symbol audit (approach §3.4). Mamba2 chunk cumsum (kernel.py
  # _chunk_cumsum_fwd_kernel): per head and per logical chunk, dt' =
  # softplus(dt) (gated) then clamp, and dA_cumsum = cumsum(A * dt') along the
  # within-chunk axis. Symbol map: T -> dt dim 0 (seqlen, the cumsum extent),
  # H -> dt dim 1 (nheads == A length == kernel grid head extent), DTSP -> the
  # `dt_softplus` scalar_knob in [0,1]; dt_bias / dt_limit are absent at the
  # bound shapes (dt_limit defaults to (0, inf)).
  # FLOPs (vector): the A*dt' multiply (~1) + the per-chunk cumsum accumulate
  # (~1) are always done over the T*H tokens -> 2*T*H. The softplus
  # pre-transform (~5 ops/element: exp, add, log, plus the overflow-safe
  # branch) runs ONLY when dt_softplus is set -> +5*DTSP*T*H. The per-chunk
  # padding (chunk_size axis vs the ragged chunk length) is a small constant
  # overhead folded into the leading factor. Total 2*T*H + 5*DTSP*T*H.
  # bytes (hbm): read dt[T,H] + A[H], write dt_out + dA_cumsum (each ~T*H live
  # elements across [H,nchunks,chunk_size]) -> (3*T*H + H) elements; all
  # float32 primary family -> dtype_size.
  flops: 2*T*H + 5*DTSP*T*H
  flops_class: vector
  bytes: (3*T*H + H) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
