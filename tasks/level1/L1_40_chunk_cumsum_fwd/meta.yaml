param_constraints:
  scaffold: false
  dims:
  # dt is [T, H] (T = seqlen, H = nheads); A is [H]. T must exceed
  # chunk_size (=16) so the derived non-uniform chunk count differs from a
  # uniform ceil(T/16) split (the cu_chunk_seqlens segmentation is the
  # load-bearing input); H >= 2 keeps the per-head axis non-degenerate.
  - T > 16
  - H >= 2
  dtypes:
    dt: float32
    A: float32
  dists:
    dt:
      kind: rand
    A:
      kind: rand
  scalars:
    dt_softplus: dt_softplus in [0, 1]
    chunk_size: chunk_size == 16
  tensor_invariants: []
