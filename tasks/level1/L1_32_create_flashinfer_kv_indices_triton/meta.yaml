# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Frozen
# create_flashinfer_kv_indices_triton is a flat gather: per request r it copies
# req_to_token[req_pool_indices[r], :seq_lens[r]] into kv_indices at offset
# kv_indptr[r], with kv_indptr[0]=0 and kv_indptr[1:]=cumsum(seq_lens) (the
# normal kv_start_idx=None host path, kv_start=0). E = batch size (bs) and
# req_to_token rows (max_batch); N = req_to_token cols (max_context_len).
# seq_lens in [1, N-1] keeps every gather inside its row. There is no page_size
# / ceil-div / block_table here (that is the sibling flashmla kernel, L1_33).
param_constraints:
  scaffold: false
  dims:
  - E >= 1
  - N >= 1
  dtypes:
    req_to_token: int32
    req_pool_indices: int64
    seq_lens: int64
  dists:
    req_to_token:
      kind: randint
      args:
        lo: '0'
        hi: N
    req_pool_indices:
      kind: randint
      args:
        lo: '0'
        hi: E
    seq_lens:
      kind: randint
      args:
        lo: '1'
        hi: N
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: req_pool_indices
      value: E
  - type: index_in_range
    args:
      input: seq_lens
      value: N
