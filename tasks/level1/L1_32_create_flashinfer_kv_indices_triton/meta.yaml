cost_model:
  # Symbol audit (approach §3.4). FlashInfer paged-KV index gather: per request
  # r, copy req_to_token[req_pool_indices[r], :seq_lens[r]] into kv_indices at
  # offset kv_indptr[r]; kv_indptr = [0, cumsum(seq_lens)]. Symbol map: E ->
  # batch size (req_pool_indices / seq_lens len, req_to_token rows, kernel grid
  # extent), N -> req_to_token dim 1 (max_context_len, per-request copy ceiling
  # since seq_lens < N).
  # FLOPs (vector): per request the cumsum accumulate (~1) plus the masked
  # block loop bookkeeping (~2) -> ~3*E integer ops; no floating-point work.
  # Dominant cost is bytes.
  # bytes (hbm), mixed-dtype rule (approach §3.2): int64 primary family
  # (req_pool_indices / seq_lens declared int64) -> dtype_size=8 for the int64
  # reads req_pool_indices[E] + seq_lens[E] -> 2*E*dtype_size. The int32 table
  # source read (up to E*N) and the int32 writes (indices up to E*N + indptr
  # E+1) use literal byte width *4 -> + (2*E*N + E + 1)*4.
  flops: 3*E
  flops_class: vector
  bytes: 2*E*dtype_size + (2*E*N + E + 1)*4
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
