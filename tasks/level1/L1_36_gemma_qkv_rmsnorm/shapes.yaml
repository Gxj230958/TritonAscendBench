hidden_shapes:
- id: H1
  name: h_tail_nonpow2_mqa
  # D=96 is not a power of two, so BLOCK=next_pow2(96)=128 and the kernel's
  # `cols < HEAD_DIM` mask must drop lanes 96..127 (tail-masking coverage).
  knobs: {M: 128, QH: 8, KVH: 1, D: 96}
- id: H2
  name: h_singleton
  knobs: {M: 2, QH: 1, KVH: 1, D: 64}
- id: H3
  name: h_deep
  knobs: {M: 512, QH: 16, KVH: 2, D: 256}
- id: H4
  name: h_mha
  knobs: {M: 64, QH: 16, KVH: 16, D: 128}
