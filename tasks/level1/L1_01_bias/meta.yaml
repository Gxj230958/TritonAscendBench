schema_version: '1.0'
benchmark_version: 0.1.0-poc
task_id: L1_01_bias
level: L1
idx: 1
name: _bias_kernel
repo: vLLM
dtype_class: VV
category: sampling
npu_difficulty: medium
upstream:
  repo: vllm-project/vllm
  path: vllm/v1/worker/gpu/sample/logit_bias.py
  commit_sha: snapshot-no-git
  file_sha256: a3060896f855d81d12ea5530709c7f776c36316038adbb250f217879b9761f0d
  function_hash: a3060896f855d81d12ea5530709c7f776c36316038adbb250f217879b9761f0d
  license: Apache-2.0
  notes: see L1_12 meta for snapshot-no-git rationale
interface:
  alias_map:
    logits: rw_in_place
    expanded_idx_mapping: ro
    pos: ro
    num_allowed_token_ids: ro
    allowed_token_ids: ro
    num_logit_bias: ro
    logit_bias_token_ids: ro
    logit_bias: ro
    min_lens: ro
    num_stop_token_ids: ro
    stop_token_ids: ro
  mutability: in_place_logits
  stride_layout: logits must be contiguous (num_tokens, vocab_size)
  workspace_policy: none
  stream_sync_policy: runner-managed
  rng_state_policy: deterministic
oracle:
  pytorch: oracle_pytorch.py::run
  gpu_triton: kernel.py::apply_logit_bias
tolerance_class: elementwise_exact_or_inf_safe
cost_model:
  # Symbol audit (approach §3.4). apply_logit_bias launches one program per
  # token over the [B, N] logits (grid = num_tokens = B). Symbol map:
  # B -> num_tokens (kernel grid extent, == logits dim 0),
  # N -> vocab_size (logits dim 1, the full-vocab mask loop extent),
  # E -> request-state count (rows of the allowed/bias/stop tables);
  # literals 8/4 are the fixed max-list lengths the kernel unrolls over
  # (see the WA.1 input-contract comment below), not size knobs.
  # FLOPs (vector): the only floating-point arithmetic is stage 2's additive
  # bias `logits += bias`, at most 8 adds per token -> 8*B. Stages 1 & 3 are
  # pure -inf stores (masking), no arithmetic.
  # bytes (hbm), mixed-dtype rule (approach §3.2): primary family is the
  # float32 `logits` -> dtype_size; dominant term is stage 1's full-vocab
  # row read+write 2*B*N. Auxiliary int64 index tensors use literal *8:
  # expanded_idx_mapping[B] + pos[B] (2*B) plus the per-request-state tables
  # num_allowed/num_logit_bias/num_stop/min_lens[E] (4*E),
  # allowed_token_ids/logit_bias_token_ids[E,8] (16*E),
  # stop_token_ids[E,4] (4*E) -> (2*B + 24*E)*8. logit_bias[E,8] is float32
  # -> literal *4 -> 32*E.
  flops: 8*B
  flops_class: vector
  bytes: 2*B*N*dtype_size + (2*B + 24*E)*8 + 32*E
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
# Operator input contract (WA.1, specs/task_api_contract.md §5.2). apply_logit_bias: logits [B, N] biased per-request via expanded_idx_mapping [B] (token->request id in [0, E)). The allowed/stop/bias token-id tables are [E, 8] / [E, 4] with companion count vectors [E]; the trailing 8 / 4 are the fixed max-list-length the kernel unrolls over.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - N >= 1
  - E >= 1
  dtypes:
    logits: float32
    expanded_idx_mapping: int64
    pos: int64
    num_allowed_token_ids: int64
    allowed_token_ids: int64
    num_logit_bias: int64
    logit_bias_token_ids: int64
    logit_bias: float32
    min_lens: int64
    num_stop_token_ids: int64
    stop_token_ids: int64
  dists:
    logits:
      kind: randn
    expanded_idx_mapping:
      kind: randint
      args:
        lo: '0'
        hi: E
    pos:
      kind: randint
      args:
        lo: '0'
        hi: N
    num_allowed_token_ids:
      kind: randint
      args:
        lo: '0'
        hi: '8'
    allowed_token_ids:
      kind: randint
      args:
        lo: '0'
        hi: N
    num_logit_bias:
      kind: randint
      args:
        lo: '0'
        hi: '8'
    logit_bias_token_ids:
      kind: randint
      args:
        lo: '0'
        hi: N
    logit_bias:
      kind: randn
    min_lens:
      kind: randint
      args:
        lo: '0'
        hi: N
    num_stop_token_ids:
      kind: randint
      args:
        lo: '0'
        hi: '4'
    stop_token_ids:
      kind: randint
      args:
        lo: '0'
        hi: N
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: expanded_idx_mapping
      value: E
oracle_simplified: simple_pytorch_ok
runner_checks:
  expected_kernel_count_range:
  - 1
  - 1
  min_dram_bytes: 32768
  min_flops: 131072
  output_format: safetensors
  output_allocation: candidate_inplace
  static_checks:
  - ast_denylist
  - import_allowlist
  - constexpr_match
  metamorphic_checks:
  - name: empty_allowed_is_noop_stage1
    description: num_allowed_token_ids[r]=0 ⇒ stage 1 makes no change to row r.
  - name: zero_bias_is_noop_stage2
    description: logit_bias[r]=0 ⇒ stage 2 is identity for row r.
  - name: pos_ge_min_len_keeps_stop_tokens
    description: pos[t] >= min_lens[r] ⇒ stage 3 must not fire.
  shape_coverage:
    public: 5
    hidden: 4
is_canary: false
is_hidden_only: false
hardware:
  npu: 910b
  ub_budget_kb: 80
  fp8_required: false
provenance:
