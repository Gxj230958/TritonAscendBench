inputs:
  prefix_output:
    dims:
    - B
    - H
    - D
    dtype: bfloat16
    dist: randn
  prefix_lse:
    dims:
    - B
    - H
    dtype: float32
    # randn_inf injects the flash-decoding empty-split sentinel (+inf).
    # The kernel maps +inf -> -inf (drop side); both-sides-inf -> NaN.
    # Exercising this branch is the load-bearing discriminator here.
    dist: randn_inf
  suffix_output:
    dims:
    - B
    - H
    - D
    dtype: bfloat16
    dist: randn
  suffix_lse:
    dims:
    - B
    - H
    dtype: float32
    # Paired empty-split sentinel: inject +inf only where prefix_lse is finite,
    # so the two splits are never BOTH empty (both-empty is the undefined NaN
    # domain, non-physical in flash-decoding). Keeps the one-sided drop branch
    # exercised on both sides; removes the NaN rows that broke strict torch.equal.
    dist: randn_inf_excl:prefix_lse
