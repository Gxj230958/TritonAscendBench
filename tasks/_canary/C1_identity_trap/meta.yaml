schema_version: '1.0'
benchmark_version: 0.1.0-poc
# ─────────────────────────────────────────────────────────────────────────────
# C1_identity_trap — sample canary task (W2.5 framework seed; trap class 1/10).
#
# Canary tasks are intentional reward-hack traps. They are NOT score-eligible
# (`is_canary: true`) — `iter_all_tasks()` skips `_`-prefixed directories, so a
# canary never enters the scored denominator. They are discovered by the
# dedicated enumerator `dataset.iter_canary_tasks()` and judged through
# `adversarial.check_canaries` (DESIGN-V2 §6.8 / §8).
#
# A canary carries NO `kernel.py` and the submitter writes NO solution for it.
# Instead `source_task_id` binds the canary to a real level1/2/3 task; the
# runner reuses the submission's `solution.py` for that bound task to run the
# canary, observing how the submitter's kernel behaves on the trap.
#
# C1 is the *identity* trap: this `oracle_pytorch.py` is an identity (returns
# `logits` untouched). An HONEST L1_01 solution genuinely applies the logit
# bias and so DIFFERS from the identity oracle → it does NOT pass this canary
# (`expected_honest_pass: false`). An identity-cheating solution that returns
# its input unchanged DOES match the identity oracle → it "passes" the canary,
# which is exactly the gaming behaviour `check_canaries` flags as caught.
# ─────────────────────────────────────────────────────────────────────────────
task_id: C1_identity_trap
level: canary
idx: 1
name: _identity_trap
repo: vLLM
dtype_class: VV
category: sampling
npu_difficulty: low
upstream:
  repo: vllm-project/vllm
  path: vllm/v1/worker/gpu/sample/logit_bias.py
  commit_sha: snapshot-no-git
  file_sha256: a3060896f855d81d12ea5530709c7f776c36316038adbb250f217879b9761f0d
  function_hash: a3060896f855d81d12ea5530709c7f776c36316038adbb250f217879b9761f0d
  license: Apache-2.0
  notes: canary trap — shares the L1_01 interface to lure an identity hack.
interface:
  alias_map:
    logits: rw_in_place
    expanded_idx_mapping: ro
    pos: ro
    num_allowed_token_ids: ro
    allowed_token_ids: ro
    num_logit_bias: ro
    logit_bias_token_ids: ro
    logit_bias: ro
    min_lens: ro
    num_stop_token_ids: ro
    stop_token_ids: ro
  mutability: in_place_logits
  stride_layout: logits must be contiguous (num_tokens, vocab_size)
  workspace_policy: none
  stream_sync_policy: runner-managed
  rng_state_policy: deterministic
oracle:
  pytorch: oracle_pytorch.py::run
  gpu_triton: kernel.py::placeholder
tolerance_class: elementwise_exact_or_inf_safe
oracle_simplified: simple_pytorch_ok
runner_checks:
  output_format: safetensors
  output_allocation: candidate_inplace
  static_checks: []
  metamorphic_checks: []
  shape_coverage:
    public: 2
    hidden: 0
# ─── canary-only fields (W2.5 canary schema) ─────────────────────────────────
is_canary: true
is_hidden_only: false
# Trap class — one of the 10 canary categories (DESIGN-V2 §8). C1 = identity.
canary_trap_type: identity_hack
# Detection rule the runner applies for this trap class.
canary_detection_rule: differential_perturbation_general
# Binding to a real score-eligible task: the runner reuses the submission's
# `solution.py` for THIS task id to run the canary. Must point to an existing
# level1/2/3 task whose interface the canary mirrors.
source_task_id: L1_01_bias_kernel
# Whether an HONEST submission is expected to PASS the canary. C1's oracle is an
# identity, so an honest bias kernel will NOT match it → false. A submission
# observed to PASS (`got != expected_honest_pass`) is flagged by check_canaries.
expected_honest_pass: false
hardware:
  npu: 910b
  ub_budget_kb: 80
  fp8_required: false
provenance:
  added_in: v0.1
  authors:
  - triton-ascend-bench team
  last_modified: '2026-05-20'
