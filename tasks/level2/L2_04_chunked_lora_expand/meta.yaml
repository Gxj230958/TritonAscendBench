cost_model:
  # Symbol audit (approach §3.4). Segmented SGMV LoRA-B expand (oracle
  # _segmented_lora_expand, kernel _chunked_lora_expand_kernel):
  # out[seg] += scaling[adapter] * (x[seg, :r] @ B[adapter, :, :r]^T).
  # shapes.yaml: x is [B, G] (B token rows, G = max LoRA rank columns),
  # weights (LoRA B) is [E, N, G] (E adapters, N output_dim, G rank),
  # output is [B, N]. Each segment's matmul is [seg_len, r] @ [r, N].
  # Analytic GEMM dims summed over all segments: M = B (total tokens),
  # K = G (rank, contracted dim = x dim 1 = weights dim 2), N = N
  # (output_dim = weights dim 1). Symbol map: B -> token rows (GEMM M),
  # G -> LoRA rank (GEMM K), N -> output_dim (GEMM N), E -> adapter
  # count (weights dim 0, index-vector length).
  # FLOPs (cube): 2*B*G*N (2 = multiply + accumulate). The scaling
  # multiply is one extra vector op per output element, negligible vs
  # the GEMM and folded into the cube cost.
  # flops_class: float32 operands; the 910B Cube unit has no fp32 cube
  # class, so cube matmul keys to fp16_cube (Unit 1 paradigm).
  # bytes (hbm): read x [B,G] + weights [E,N,G], write output [B,N];
  # all float32 primary family -> dtype_size. Auxiliary tensors at
  # literal widths: seg_indptr [E+1] int64 *8, weight_indices [E]
  # int64 *8, lora_ranks [E] int64 *8, scalings [E] float32 *4.
  flops: 2*B*G*N
  flops_class: fp16_cube
  bytes: (B*G + E*N*G + B*N) * dtype_size + (E+1)*8 + E*8 + E*8 + E*4
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
