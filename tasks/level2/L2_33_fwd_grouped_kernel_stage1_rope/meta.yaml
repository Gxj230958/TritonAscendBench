# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Grouped attention stage-1 with RoPE: q [B, H, D] attends over a paged k_buffer / v_buffer [C, D]. scale is the QK softmax scale, derived as 1/sqrt(D) (was a 0.125 placeholder; WB.1 derive-form fix).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - H >= 1
  - D >= 1
  - C >= 1
  dtypes:
    q: float32
    k_buffer: float32
    v_buffer: float32
  dists:
    q:
      kind: randn
    k_buffer:
      kind: randn
    v_buffer:
      kind: randn
  scalars:
    scale:
      derive: 1/sqrt(D)
  tensor_invariants: []
