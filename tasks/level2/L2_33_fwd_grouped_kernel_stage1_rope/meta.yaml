  # NUM_KV_SPLITS / split-config fixture choice can constexpr-fold the assert away,
  # and the only compilable BLOCK_H=1 / USE_ROPE=False regimes would require editing
  # the frozen kernel or dropping the graded RoPE operator. The frozen kernel.py is
  # byte-immutable, so this cannot be fixed without corrupting the operator. Root
  # cause validated with codex (gpt-5.5:xhigh) and reproduced locally on Triton
  # 3.6.0. The grading scaffold (oracle/launcher/shapes) is left at the committed
  # baseline: any oracle/launcher would be moot since the original side never
