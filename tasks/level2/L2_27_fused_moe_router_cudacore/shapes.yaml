inputs:
  x:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  router_weight:
    dims:
    - '8'
    - D
    dtype: float32
    dist: randn
  topk:
    scalar: 2
  # R4-2: softcap magnitude varies per shape row via the SOFTCAP knob
  # (0 = softcap disabled, >0 = enabled) so the oracle's
  # `c * tanh(logits / c)` branch is exercised on both sides.
  moe_softcapping:
    scalar_knob: SOFTCAP
  correction_bias:
    dims:
    - '8'
    dtype: float32
    dist: rand
  BLOCK_SIZE_M:
    scalar: 64
  BLOCK_SIZE_N:
    scalar: 64

