# Operator input contract (WA.1, specs/task_api_contract.md §5.2). DeepSeek-V3 MLA K assembly: per head, concat the per-head nope part k_nope[B, H, Dn] with the shared rope part k_rope[B, 1, Dr] (broadcast across the H heads) and cast to out_dtype. The frozen @triton.jit kernel uses tl.arange(0, H/Dn/Dr) without masking, so H, Dn and Dr must be powers of two. out_dtype names the output cast target.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - H >= 1
  - Dn >= 1
  - Dr >= 1
  dtypes:
    k_nope: float32
    k_rope: float32
  dists:
    k_nope:
      kind: randn
    k_rope:
      kind: randn
  scalars:
    out_dtype: out_dtype in ['bf16', 'bfloat16', 'fp16', 'float16', 'float32', 'fp32']
  tensor_invariants: []
