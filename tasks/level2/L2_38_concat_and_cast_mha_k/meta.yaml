cost_model:
  # Symbol audit (approach §3.4). DeepSeek-V3 MLA K assembly: per head, concat
  # the per-head nope part with the SHARED rope part then cast to the cache
  # dtype. One grid program per token. Symbol map: B -> n_tokens (k_nope/k_rope
  # dim 0, kernel grid extent), H -> num_local_heads (k_nope dim 1, k_rope dim 1
  # is the broadcast singleton), Dn -> nope_dim, Dr -> rope_dim; the output is
  # [B, H, Dn + Dr]. out_dtype is a scalar literal selecting the cast target.
  # FLOPs (vector): pure copy + dtype cast — no floating-point arithmetic.
  # One cast op per output element -> B*H*(Dn+Dr); the dominant cost is bytes.
  # bytes (hbm), mixed-dtype rule (approach §3.2): float32 primary family
  # (k_nope declared first) -> dtype_size=4. Reads: k_nope[B,H,Dn] -> B*H*Dn*4
  # plus the shared rope k_rope[B,1,Dr] -> B*Dr*4 (read once, broadcast across
  # heads). The output k[B,H,Dn+Dr] is cast to the out_dtype scalar (bf16,
  # non-primary dtype) -> literal byte width 2 -> + B*H*(Dn+Dr)*2.
  flops: B*H*(Dn+Dr)
  flops_class: vector
  bytes: (B*H*Dn + B*Dr)*dtype_size + B*H*(Dn+Dr)*2
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
