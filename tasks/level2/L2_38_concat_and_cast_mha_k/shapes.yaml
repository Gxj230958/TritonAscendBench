# Operator: DeepSeek-V3 MLA K assembly (concat_and_cast_mha_k).
# Real upstream contract (sglang/srt/layers/attention/utils.py +
# sarvam_moe.py / forward_mha.py call sites):
#   k_nope : [B, H, Dn]  per-head nope part   (B = n_tokens, H = num_local_heads)
#   k_rope : [B, 1, Dr]  shared rope part, broadcast across the H heads
#   k      : [B, H, Dn + Dr] = empty(out_dtype); written by the kernel
# The frozen @triton.jit kernel uses tl.arange(0, H/Dn/Dr) with no masking,
# so H, Dn and Dr must all be powers of two; Dn + Dr need not be.
size_knobs:
  B: 512
  H: 16
  Dn: 128
  Dr: 64
public_shapes:
- id: P1
  name: tiny
  knobs:
    B: 8
    H: 2
    Dn: 32
    Dr: 16
- id: P2
  name: small
  knobs:
    B: 64
    H: 4
    Dn: 64
    Dr: 32
- id: P3
  name: medium
  knobs:
    B: 512
    H: 16
    Dn: 128
    Dr: 64
- id: P4
  name: large
  knobs:
    B: 2048
    H: 32
    Dn: 128
    Dr: 64
- id: P5
  name: wide_heads
  knobs:
    B: 16
    H: 64
    Dn: 256
    Dr: 64
hidden_shapes:
- id: H1
  name: h_deep_dim
  knobs:
    B: 384
    H: 8
    Dn: 512
    Dr: 128
- id: H2
  name: h_singleton
  knobs:
    B: 2
    H: 2
    Dn: 16
    Dr: 16
- id: H3
  name: h_many_tokens
  knobs:
    B: 4096
    H: 8
    Dn: 64
    Dr: 32
- id: H4
  name: h_single_head
  knobs:
    B: 128
    H: 1
    Dn: 128
    Dr: 64
inputs:
  k_nope:
    dims:
    - B
    - H
    - Dn
    dtype: float32
    dist: randn
  k_rope:
    dims:
    - B
    - 1
    - Dr
    dtype: float32
    dist: randn
  out_dtype:
    scalar: bf16
