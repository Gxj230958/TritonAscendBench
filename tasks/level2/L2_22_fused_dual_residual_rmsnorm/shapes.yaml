inputs:
  # Match the frozen upstream host wrapper
  # fused_dual_residual_rmsnorm(x, residual, weight1, weight2, eps):
  # x and residual are 2D [B, D] and MUST share dtype (wrapper asserts
  # x.shape == residual.shape and x.dtype == residual.dtype); weight1 and
  # weight2 are per-hidden-dim [D]; eps is the variance epsilon scalar.
  x:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  residual:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  weight1:
    dims:
    - D
    dtype: bfloat16
    dist: randn
  weight2:
    dims:
    - D
    dtype: bfloat16
    dist: randn
  eps:
    scalar: 1.0e-05
