# Operator input contract for vLLM _gumbel_sample_kernel (gumbel-max sampler).
# Size knobs:
#   T = num_tokens (kernel grid dim 0; one program column per token)
#   V = vocab_size (inner reduction axis, tiled into BLOCK_SIZE=1024 blocks)
#   R = max_num_reqs (request axis; temperature[R], seed[R] are per-request)
# Each token t routes to request expanded_idx_mapping[t] in [0, R); its
# temperature + seed come from that request. pos[t] is the per-token sampling
# position feeding the Philox gumbel-noise seed.
size_knobs:
  T: 128
  V: 4096
  R: 8
public_shapes:
- id: P1
  name: tiny
  knobs:
    T: 4
    V: 2048
    R: 3
