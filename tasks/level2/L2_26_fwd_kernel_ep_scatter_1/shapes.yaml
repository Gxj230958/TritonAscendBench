# Operator input contract for `_fwd_kernel_ep_scatter_1` (the named entrypoint).
# The kernel builds the DeepGEMM contiguous-group layout from the per-expert
# token counts: out = (expert_start_loc[E], m_indices[M_sum]). Its ONLY data
# input is num_recv_tokens_per_expert[E] (E = number of experts, knob `E`);
# expert_start_loc / m_indices are launcher-allocated outputs (candidate_inplace).
# Token counts in [0, T) so some experts may be empty (exercises the -1 padding
# and zero-width-region path); T = per-expert token cap knob.
- id: H5
  name: edge_CPU-valid; pending 
  knobs:
    E: 1
inputs:
  num_recv_tokens_per_expert:
    dims:
    - E
    dtype: int32
    dist: "randint:0:T"

explicit_view:
  P1:
    provenance: baseline
    tensors:
      num_recv_tokens_per_expert: '[4] int32 axes=E dist=randint(lo=0, hi=T)'
  P2:
    provenance: baseline
    tensors:
      num_recv_tokens_per_expert: '[8] int32 axes=E dist=randint(lo=0, hi=T)'
  P3:
