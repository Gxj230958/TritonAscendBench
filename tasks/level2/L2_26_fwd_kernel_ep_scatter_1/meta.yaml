# Operator input contract (WA.1, specs/task_api_contract.md §5.2). EP scatter: recv_x [n_tokens, D] rows scattered to dst_index [n_tokens] destination rows. dst_index is a permutation (arange) over [0, out_rows); out_rows is the scatter row count (= B).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - D >= 1
  dtypes:
    recv_x: float32
    dst_index: int64
  dists:
    recv_x:
      kind: randn
    dst_index:
      kind: arange
  scalars:
    out_rows: out_rows >= 1
  tensor_invariants:
  - type: index_in_range
    args:
      input: dst_index
      value: B
