  # Symbol audit (approach §3.4). `_fwd_kernel_ep_scatter_1` builds the
  # DeepGEMM contiguous-group layout: from num_recv_tokens_per_expert[E] it
  # writes expert_start_loc[E] (padded exclusive prefix sum) and fills
  # m_indices[M_sum] with expert ids (-1 padding). Symbol map: E -> number of
  # experts (grid extent, num_recv_tokens_per_expert dim 0), M_sum ->
  # sum_e round_up_128(counts[e]) (the m_indices length the kernel fills).
  # FLOPs (vector): only the per-expert cumsum + round-up — O(E) integer ops,
  # reported as the small constant E. Dominant cost is the m_indices writes.
  # bytes (hbm): read counts[E] (int32 -> 4*E) + write expert_start_loc[E]
  # (int32 -> 4*E) + write m_indices[M_sum] (int32 -> 4*M_sum).
  flops: E
  flops_class: vector
  bytes: 8*E + 4*M_sum
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
