cost_model:
  # Symbol audit (approach §3.4). Expert-parallel token scatter: out[dst_index
  # [i]] = recv_x[i] — a local row scatter (no cross-rank traffic, so
  # bytes_resource is hbm per approach §3.2). Symbol map: B -> token rows
  # (recv_x / dst_index dim 0 == out_rows scalar_knob, kernel grid extent),
  # D -> recv_x dim 1 (the per-row copy width).
  # FLOPs (vector): pure scatter/copy, no arithmetic at all -> reported as the
  # small constant B (one address computation per token). Dominant cost is
  # bytes.
  # bytes (hbm), mixed-dtype rule (approach §3.2): primary family is the
  # float32 recv_x -> dtype_size; read recv_x + write output [B,D] -> 2*B*D.
  # The int64 dst_index[B] uses literal *8 -> 8*B.
  flops: B
  flops_class: vector
  bytes: 2*B*D*dtype_size + 8*B
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
