cost_model:
  # Symbol audit (approach §3.4). Block-wise W8A8 INT8 GEMM (oracle
  # oracle_w8a8_block_int8_matmul, kernel _w8a8_block_int8_matmul):
  # C = A_dequant @ B_dequant^T with per-(token, k-group) scale As and
  # per-(n-block, k-group) scale Bs. shapes.yaml: A is [B, D] int8,
  # B is [N, D] int8, output C is [B, N]. The GEMM is [B, D] @ [D, N]
  # (B's D axis is the contracted dim, B^T gives the N output dim).
  # GEMM dims: M = B (A rows = C rows), K = D (contracted dim = A dim 1
  # = B dim 1), N = N (B dim 0 = C cols). Symbol map: B -> token rows
  # (GEMM M), D -> contracted feature dim (GEMM K), N -> output dim
  # (GEMM N). As is [B, D//8], Bs is [N//8, D//8].
  # FLOPs (cube): 2*B*N*D (2 = multiply + accumulate). The per-K-block
  # scale multiply (accumulator * a_s * b_s) is a small vector op vs
  # the int8 matmul and folded into the cube cost.
  # flops_class: int8 — A and B are int8 quantised operands, so the
  # matmul runs on the 910B Cube unit's int8 pipe (approach §3.1
  # decision table).
  # bytes (hbm): read A [B,D] + B [N,D] int8 primary family ->
  # dtype_size (= 1). The float32 scale tensors As [B,D//8] and Bs
  # [N//8,D//8] are non-primary dtype, counted at the literal 4-byte
  # width. Output C [B,N] is written in the fp16 default output dtype,
  # counted at literal 2 bytes.
  flops: 2*B*N*D
  flops_class: int8
  bytes: (B*D + N*D) * dtype_size + B*(D//8)*4 + (N//8)*(D//8)*4 + B*N*2
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: upstream_oracle_required
runner_checks:
  expected_kernel_count_range:
  - 1
  - 1
  min_dram_bytes: 524288
  min_flops: 16777216
  output_format: safetensors
  output_allocation: candidate_allocated
  static_checks:
  - ast_denylist
  - import_allowlist
  - constexpr_match
  - cube_arithmetic_present
  metamorphic_checks:
  - name: scale_homogeneity_a
    description: 'Doubling all entries of As doubles every output value exactly

      (within fp16 rounding at the final cast).

      '
  - name: zero_a_yields_zero
    description: A = 0 ⇒ C = 0 regardless of B, As, Bs.
  shape_coverage:
