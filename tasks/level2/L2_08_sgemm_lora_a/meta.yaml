cost_model:
  # Symbol audit (approach §3.4). Segmented SGMV LoRA-A shrink (oracle
  # _segmented_lora_shrink, kernel _sgemm_lora_a_kernel):
  # out[seg, :r] = x[seg] @ A[adapter, :r, :]^T.
  # shapes.yaml: x is [B, D] (B token rows, D = input_dim columns),
  # weights (LoRA A) is [E, G, D] (E adapters, G = max rank, D
  # input_dim), output is [B, G]. Each segment's matmul is
  # [seg_len, D] @ [D, r]. Analytic GEMM dims summed over all segments:
  # M = B (total tokens), K = D (input_dim, contracted dim = x dim 1 =
  # weights dim 2), N = G (LoRA rank = weights dim 1). Symbol map:
  # B -> token rows (GEMM M), D -> input_dim (GEMM K), G -> LoRA rank
  # (GEMM N), E -> adapter count (weights dim 0, index-vector length).
  # FLOPs (cube): 2*B*D*G (2 = multiply + accumulate).
  # flops_class: float32 operands; the 910B Cube unit has no fp32 cube
  # class, so cube matmul keys to fp16_cube (Unit 1 paradigm).
  # bytes (hbm): read x [B,D] + weights [E,G,D], write output [B,G];
  # all float32 primary family -> dtype_size. Auxiliary tensors at
  # literal widths: seg_indptr [E+1] int64 *8, weight_indices [E]
  # int64 *8, lora_ranks [E] int64 *8.
  flops: 2*B*D*G
  flops_class: fp16_cube
  bytes: (B*D + E*G*D + B*G) * dtype_size + (E+1)*8 + E*8 + E*8
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
