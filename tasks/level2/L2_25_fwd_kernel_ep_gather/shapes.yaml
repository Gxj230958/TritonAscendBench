  P1:
    provenance: baseline
    tensors:
      input_tensor: '[8, 64] bfloat16 axes=B,D dist=randn'
      recv_topk_ids: '[16, 2] int32 axes=T,K dist=randint(lo=-1, hi=E)'
      recv_topk_weight: '[16, 2] bfloat16 axes=T,K dist=randn'
      input_index: '[16, 2] int32 axes=T,K dist=randint(lo=0, hi=B)'
