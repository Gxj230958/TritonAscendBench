# Upstream `_fwd_kernel_ep_gather` (vLLM deep_gemm_utils.py, commit 18f6bf5)
# contract, expert_map=None path. The kernel is an unpermute-and-weighted-
# reduce, NOT a plain gather:
#   out[t, :] = sum_k 1[recv_topk_ids[t,k] >= 0]
#                     * recv_topk_weight[t, k]
#                     * input_tensor[input_index[t, k], :]
# B = input_tensor row count (M, the permuted grouped-gemm buffer);
# T = output token rows; K = topk_num; D = hidden size.
inputs:
  input_tensor:
    dims:
    - B
    - D
    dtype: float32
    dist: randn
  recv_topk_ids:
    # Signed expert ids; values < 0 (i.e. -1) mark invalid/padded slots that
    # the kernel skips. randint:-1:E keeps a mix of valid and -1 entries so
    # the validity mask is exercised. int32 mirrors upstream signed topk_ids.
    dims:
    - T
    - K
    dtype: int32
    dist: randint:-1:E
  recv_topk_weight:
    dims:
    - T
    - K
    dtype: float32
    dist: randn
  input_index:
    # Source-row indices into input_tensor rows ([0, B)); upstream inv_perm.
    dims:
    - T
    - K
    dtype: int32
    dist: randint:0:B
