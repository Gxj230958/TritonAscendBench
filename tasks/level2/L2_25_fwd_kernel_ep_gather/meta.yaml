cost_model:
  # Symbol audit (approach §3.4). Expert-parallel unpermute-and-weighted-
  # reduce (upstream `_fwd_kernel_ep_gather`, expert_map=None):
  #   out[t, :] = sum_k mask[t,k] * recv_topk_weight[t,k]
  #                     * input_tensor[input_index[t,k], :]
  # Local gather + scaled accumulate (no cross-rank traffic, so
  # bytes_resource is hbm per approach §3.2). Symbol map: T -> output token
  # rows (grid dim 1), K -> topk_num (constexpr inner loop), D -> hidden
  # width (input_tensor dim 1), B -> input_tensor row count (gather source).
  # FLOPs (vector): per (t, k, d) a multiply-add into a fp32 accumulator
  # -> 2*T*K*D.
  # bytes (hbm), mixed-dtype rule (approach §3.2): primary family is the
  # float32 input_tensor -> dtype_size; gather reads T*K source rows of D
  # plus write output T*D -> (T*K + T)*D*dtype_size. The int32 index /
  # id / weight side tensors [T,K] use literal *4 -> 3*4*T*K.
  flops: 2*T*K*D
  flops_class: vector
  bytes: (T*K + T)*D*dtype_size + 12*T*K
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: upstream_oracle_required
