# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Upstream
# `_fwd_kernel_ep_gather` (vLLM deep_gemm_utils.py, commit 18f6bf5),
# expert_map=None path: an unpermute-and-weighted-reduce, NOT a plain gather.
#   out[t, :] = sum_k 1[recv_topk_ids[t,k] >= 0]
#                     * recv_topk_weight[t, k]
#                     * input_tensor[input_index[t, k], :]
# B = input_tensor rows (M, permuted grouped-gemm buffer); T = output token
# rows; K = topk_num; D = hidden. recv_topk_ids < 0 (-1) marks skipped slots;
# input_index entries are valid rows in [0, B).
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - T >= 1
  - K >= 1
  - D >= 1
  dtypes:
    input_tensor: float32
    recv_topk_ids: int32
    recv_topk_weight: float32
    input_index: int32
  dists:
    input_tensor:
      kind: randn
    recv_topk_ids:
      kind: randint
      args:
        lo: '-1'
        hi: E
    recv_topk_weight:
      kind: randn
    input_index:
      kind: randint
      args:
        lo: '0'
        hi: B
  scalars: {}
  tensor_invariants:
  - type: index_in_range
    args:
      input: input_index
      value: B
