# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Gate/up LoRA-B
# segmented GEMM (sglang gate_up_lora_b_fwd): x [E*C, 2*G] is the LoRA-A result
# (gate||up rank halves), gate_up_lora_b [E, 2*N, G] is the per-adapter LoRA-B
# weights (gate||up output halves), output [E*C, 2*N]. seg_indptr [E+1] is the
# monotonic per-segment offsets vector (= [0, C, ..., E*C], fixed-length C
# segments); weight_indices [E] selects the LoRA adapter slab (index in [0, E));
# lora_ranks [E] is the per-adapter rank in [1, G]; K = min(G, lora_ranks[w]).
# permutation is None (SORTED_BY_ADAPTER False): rows are contiguous.
param_constraints:
  scaffold: false
  dims:
  - C >= 1
  - E >= 1
  - G >= 1
  - N >= 1
  dtypes:
    x: float32
    gate_up_lora_b: float32
    seg_indptr: int64
    weight_indices: int64
    lora_ranks: int64
    scalings: float32
  dists:
    x:
      kind: randn
    gate_up_lora_b:
      kind: randn
    seg_indptr:
      kind: offsets
      args:
        to: E*C
    weight_indices:
      kind: arange
    lora_ranks:
      kind: randint
      args:
        lo: '1'
        hi: G+1
    scalings:
      kind: rand
  scalars: {}
  tensor_invariants:
  - type: monotonic_nondecreasing
    args:
      input: seg_indptr
  - type: index_in_range
    args:
      input: weight_indices
      value: E
