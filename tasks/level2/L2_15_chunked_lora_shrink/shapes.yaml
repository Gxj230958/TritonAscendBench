# Dense fixture for the chunked SGMV LoRA-A shrink. The authored
# _pa_launcher.py drives the in-module @triton.jit
# `_chunked_lora_shrink_kernel` directly (bypassing the upstream host wrapper,
# whose get_device_name() is None off-GPU and whose LoRABatchInfo import is a
# T3 BLOCKED closure) and derives the wrapper's batch_info fields from these
# dense tensors: num_segments = len(seg_indptr) - 1, BLOCK_M = max(diff(
# seg_indptr)), permutation = identity arange(S) (the oracle's row mapping).
# Knob roles: B -> total tokens s (x rows); D -> input_dim K (contracted);
# E -> num_segments == num_lora adapters; G -> max LoRA rank (output cols N).
# seg_indptr `offsets:to=B` pins the segment cumsum to B so the segments tile
# [0, B) and every kernel row read stays in-bounds. weight_indices selects the
# adapter slab per segment and lora_ranks masks the active output columns --
# both are load-bearing (a kernel ignoring either fails the oracle compare).
- id: H5
  name: edge_CPU-valid; pending 
  knobs:
    B: 1
    D: 1
    E: 1
    G: 1
- id: H6
  name: edge_CPU-valid; pending 
  knobs:
    B: 1
    D: 512
    E: 8
    G: 4
inputs:
  x:
    dims:
    - B
    - D
    dtype: bfloat16
    dist: randn
  weights:
    dims:
    - E
    - G
    - D
    dtype: bfloat16
    dist: randn
  seg_indptr:
    dims:
    - E+1
    dtype: int64
    dist: offsets:to=B
  weight_indices:
    dims:
    - E
    dtype: int64
    dist: randint:0:E
  lora_ranks:
    dims:
    - E
    dtype: int64
    dist: randint:1:G
  num_slices:
    scalar: 1

explicit_view:
  P1:
    provenance: baseline
    tensors:
      x: '[16, 32] bfloat16 axes=B,D dist=randn'
      weights: '[4, 2, 32] bfloat16 axes=E,G,D dist=randn'
      seg_indptr: '[5] int64 axes=E+1 dist=offsets(to=B)'
      weight_indices: '[4] int64 axes=E dist=randint(lo=0, hi=E)'
