# Inputs match the graded host wrapper
# kernel.py::w8a8_triton_block_scaled_mm. The jit reads N, K = B.shape and
# contracts over K (B is [N, K], the GEMM is A @ B.T), with Bs laid out
# [ceil(N/block_n), ceil(K/block_k)]. block_size = [block_n, block_k] = [8, 32]:
# block_n=8 is the N-block scale tile, block_k=32 is the K-block scale tile and
# also BLOCK_SIZE_K. block_k must be >= 32 because the int8 tl.dot launch
# requires a K-tile of at least 32 (see scripts/lint_shapes_against_kernel.py;
# the passed sibling L2_10 uses the same [8, 32]).
- id: H5
  name: edge_CPU-valid; pending 
  knobs:
    B: 1
    D: 8
    N: 8
- id: H6
  name: edge_CPU-valid; pending 
  knobs:
    B: 1
    D: 512
    N: 384
- id: H7
  name: edge_CPU-valid; pending 
  knobs:
    B: 1536
    D: 1024
    N: 8
inputs:
  A:
    dims:
    - B
    - D
    dtype: int8
    dist: randint:0:8
  B:
    dims:
    - N
    - D
    dtype: int8
    dist: randint:0:8
  As:
    dims:
    - B
    - (D+31)//32
    dtype: float32
    dist: rand
  Bs:
    dims:
    - N//8
    - (D+31)//32
    dtype: float32
    dist: rand
  block_size:
    scalar_seq:
    - 8
    - 32

