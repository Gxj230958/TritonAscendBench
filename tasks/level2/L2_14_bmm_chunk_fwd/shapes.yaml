inputs:
  a:
    dims:
    - C*4
    - H
    - D
    dtype: bfloat16
    dist: randn
  b:
    dims:
    - C*4
    - H
    - D
    dtype: bfloat16
    dist: randn
  chunk_size:
    scalar: 4
  cu_chunk_seqlens:
    dims:
    - C+1
    dtype: int64
    # Non-uniform chunk spans (random increments in [1, chunk_size]); breaks
    # the identity uniform mapping so a kernel ignoring cu_chunk_seqlens (or
    # mis-indexing the per-chunk token span / tail padding) cannot pass.
    dist: offsets:4
  causal:
    scalar_knob: CAUSAL
