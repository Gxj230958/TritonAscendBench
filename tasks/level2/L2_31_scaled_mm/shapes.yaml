# W8A8 scaled GEMM knob grid: A[M,K] @ B[K,N] with per-token (scale_a[M,1])
# and per-channel (scale_b[N,1]) dequant scales, optional bias[N]. K is the
# contracted dim; values are kept multiples of 16 so the int8 tl.dot tiles
# stay aligned (the kernel masks the K tail regardless).
size_knobs:
  M: 128
  N: 256
  K: 512
