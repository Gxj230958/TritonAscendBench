inputs:
  A:
    dims: [M, K]
    dtype: int8
    dist: randint:-127:127
  B:
    dims: [K, N]
    dtype: int8
    dist: randint:-127:127
  scale_a:
    dims: [M, 1]
    dtype: float32
    dist: rand
  scale_b:
    dims: [N, 1]
    dtype: float32
    dist: rand
  bias:
    dims: [N]
    dtype: bfloat16
    dist: randn
