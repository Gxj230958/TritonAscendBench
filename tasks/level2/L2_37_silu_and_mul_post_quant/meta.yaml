# Operator input contract (WA.1, specs/task_api_contract.md §5.2). SiLU-gated mul + fp8 post-quant: input [E, T, 2*D] split on the last axis into gate/value halves; masked_m [E] is the per-expert token count. quant_group_size is the quant group; fp8_max the fp8 bound.
param_constraints:
  scaffold: false
  dims:
  - E >= 1
  - T >= 1
  - D >= 1
  dtypes:
    input: float32
    masked_m: int64
  dists:
    input:
      kind: randn
    masked_m:
      kind: randint
      args:
        lo: '0'
        hi: T
  scalars:
    quant_group_size: quant_group_size >= 1
    fp8_max: 0 < fp8_max <= 1e4
