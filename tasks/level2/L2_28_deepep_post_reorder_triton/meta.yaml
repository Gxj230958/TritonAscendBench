cost_model:
  # Symbol audit (approach §3.4). DeepEP combine: weighted sum over a token's
  # topk expert outputs, out[i] = sum_j x[src2dst[i,j]] * topk_weights[i,j] —
  # a local gather + weighted reduce (no cross-rank traffic, bytes_resource is
  # hbm per approach §3.2). Symbol map: B -> n_tokens (topk_weights dim 0,
  # kernel grid extent), D -> x dim 1 (the per-row width); topk is a scalar
  # literal (2), so x has B*topk = B*2 rows and src2dst has B*2 entries.
  # FLOPs (vector): per output element topk=2 contributions, each a mul + an
  # accumulate add -> ~4 ops -> 4*B*D.
  # bytes (hbm), mixed-dtype rule (approach §3.2): primary family is the
  # float32 x -> dtype_size; read x[B*2,D] (2*B*D) + write output[B,D] (B*D)
  # -> 3*B*D. The int64 src2dst[B*2] uses literal *8 -> 16*B; the float32
  # topk_weights[B,2] uses literal *4 -> 8*B.
  flops: 4*B*D
  flops_class: vector
  bytes: 3*B*D*dtype_size + 16*B + 8*B
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
