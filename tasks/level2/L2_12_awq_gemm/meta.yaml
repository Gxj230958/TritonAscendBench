# Operator input contract (WA.1, specs/task_api_contract.md §5.2). AWQ 4-bit GEMM: input [B, N] matmul'd against the dequantised packed qweight [N, E] with per-group scales [N/8, E*8] and packed qzeros [N/8, E]. group_size=8 ⇒ N % 8 == 0.
param_constraints:
  scaffold: false
  dims:
  - N % 8 == 0
  - N >= 8
  - B >= 1
  - E >= 1
  dtypes:
    input: float32
    qweight: int64
    scales: float32
    qzeros: int64
  dists:
    input:
      kind: randn
    qweight:
      kind: randint
      args:
        lo: '0'
        hi: '65535'
    scales:
      kind: rand
    qzeros:
      kind: randint
      args:
        lo: '0'
        hi: '65535'
  scalars:
    group_size: group_size == 8
  tensor_invariants: []
