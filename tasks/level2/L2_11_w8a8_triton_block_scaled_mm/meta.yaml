# Operator input contract (WA.1, specs/task_api_contract.md §5.2). W8A8 block-scaled matmul: A [B, D] @ B [N, D].T with per-block scales As [B, ceil(D/32)] / Bs [ceil(N/8), ceil(D/32)]. block_size = [block_n, block_k] = [8, 32] is the quant tile (block_k>=32 for the int8 tl.dot K-tile); N % 8 == 0.
param_constraints:
  scaffold: false
  dims:
  - D % 8 == 0
  - N % 8 == 0
  - D >= 8
  - N >= 8
  - B >= 1
  dtypes:
    A: int8
    B: int8
    As: float32
    Bs: float32
  dists:
    A:
      kind: randint
      args:
        lo: '0'
        hi: '8'
    B:
      kind: randint
      args:
        lo: '0'
        hi: '8'
    As:
      kind: rand
    Bs:
      kind: rand
  scalars:
    block_size: len(block_size) == 2 and block_size[0] == 8 and block_size[1] == 32
  tensor_invariants: []
