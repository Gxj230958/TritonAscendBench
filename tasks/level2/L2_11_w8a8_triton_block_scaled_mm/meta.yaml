cost_model:
  # Symbol audit (approach §3.4). Block-scaled W8A8 INT8 GEMM. Graded
  # kernel: host wrapper kernel.py::w8a8_triton_block_scaled_mm launching
  # the @triton.jit _w8a8_triton_block_scaled_mm. The jit reads
  # N, K = B.shape and contracts over K (B is [N, K] in memory; the GEMM
  # is A @ B.T), so:
  # C[m,n] = sum_k A[m,k]*B[n,k]*As[m,k//bk]*Bs[n//bn,k//bk], fp32 acc.
  # shapes.yaml: A is [B, D], B is [N, D], output C is [B, N]. GEMM dims:
  # M = B (A rows = C rows), K = D (contracted dim = A dim 1 = B dim 1),
  # N = N (B dim 0 = C cols). Symbol map: B -> token rows (GEMM M),
  # D -> contracted feature dim (GEMM K), N -> output dim (GEMM N).
  # block_size = [block_n, block_k] = [8, 32]: block_n=8 is the N-block
  # scale tile, block_k=32 is the K-block scale tile (and BLOCK_SIZE_K;
  # int8 tl.dot needs K-tile >= 32). As is [B, ceil(D/32)], Bs is
  # [ceil(N/8), ceil(D/32)].
  # FLOPs (cube): 2*B*N*D (2 = multiply + accumulate). The per-K-block
  # scale multiply is a small vector op vs the matmul, folded into cube.
  # flops_class: int8 — A and B carry int8-range quantised values
  # (dist randint:0:8, dtype int8); the operation is a W8A8 quantised
  # GEMM, so it runs on the 910B Cube unit's int8 pipe (approach §3.1
  # decision table).
  # bytes (hbm): read A [B,D] + B [N,D], both int8 primary family ->
  # dtype_size (= 1). The float32 scale tensors As [B,ceil(D/32)] and
  # Bs [ceil(N/8),ceil(D/32)] are non-primary dtype, counted at the
  # literal 4-byte width. Output C [B,N] is written in the fp16 default
  # output dtype, literal 2 bytes.
  flops: 2*B*N*D
  flops_class: int8
  bytes: (B*D + N*D) * dtype_size + B*((D+31)//32)*4 + (N//8)*((D+31)//32)*4 + B*N*2
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
