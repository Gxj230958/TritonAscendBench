# Operator input contract (WA.1, specs/task_api_contract.md §5.2). QKV LoRA-B GEMM: per-segment LoRA-B projection of the fused QKV slice. seg_indptr [E+1] is the monotonic per-expert segment offsets vector; weight_indices [E] selects the LoRA weight slab (index in [0, E)); lora_ranks [E] is the per-expert rank.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - E >= 1
  - G >= 1
  - N >= 1
  dtypes:
    x: float32
    qkv_lora_b: float32
    seg_indptr: int64
    weight_indices: int64
    lora_ranks: int64
    scalings: float32
  dists:
