cost_model:
  # Symbol audit (approach §3.4). GDN gating (upstream fused_gdn_gating):
  #   g           = -exp(A_log) * softplus(a + dt_bias)   [beta/threshold guard]
  #   beta_output = sigmoid(b)
  # A pure elementwise map; one program per (batch, head_block). Symbol map:
  # B -> a/b dim 0 (batch row count, grid dim 0), D -> num_heads = a/b dim 1
  # (per-row elementwise extent; also A_log/dt_bias length, broadcast over B).
  # beta / threshold are scalar literals.
  # FLOPs (vector): g path ~10 per elem (add, beta scale, softplus exp/add/log/
  # branch, exp(A_log)+negate+mul); beta_output sigmoid ~4 -> ~14*B*D.
  # bytes (hbm): read a + b [B,D] (2*B*D) + A_log + dt_bias [D] (2*D ~ 0),
  # write g + beta_output [1,B,D] (2*B*D) -> ~4*B*D float32 elements.
  flops: 14*B*D
  flops_class: vector
  bytes: 4*B*D*dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
