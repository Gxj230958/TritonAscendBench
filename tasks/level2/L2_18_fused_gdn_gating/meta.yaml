# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Fused gated-delta-net gating. a / b are [B, D] (batch tokens x num_heads); A_log / dt_bias are per-head [D] params broadcast over the batch. Outputs g [1, B, D] (float32) and beta_output = sigmoid(b) [1, B, D]. beta is the gate temperature, threshold the softplus saturation cutoff.
param_constraints:
  scaffold: false
  dims:
  - B >= 1
  - D >= 1
  dtypes:
    A_log: float32
    a: float32
    b: float32
    dt_bias: float32
  dists:
    A_log:
      kind: randn
    a:
      kind: randn
    b:
      kind: randn
    dt_bias:
      kind: randn
  scalars:
    beta: beta > 0
    threshold: threshold > 0
  tensor_invariants: []
