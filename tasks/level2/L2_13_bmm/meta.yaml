cost_model:
  # Symbol audit (approach §3.4). Batched matmul C = a @ b with
  # a [B, L, D], b [B, D, N], C [B, L, N] (see oracle_pytorch._bmm and the
  # WA.1 input-contract comment). Per-batch matmul [L,D]@[D,N] has GEMM dims
  # M=L, K=D, N=N. Symbol map: B -> batch (a/b/C dim 0),
  # L -> GEMM M (a dim 1, C dim 1), D -> GEMM K (contracted dim, a dim 2 ==
  # b dim 1), N -> GEMM N (b dim 2, C dim 2).
  # FLOPs (cube): per batch 2*L*N*D (2 = multiply + accumulate); over B
  # batches -> 2*B*L*N*D. This matches the upstream kernel's own
  # _matmul_launch_metadata: flops = 2.0*m*n*k.
  # flops_class: operands are float32; the 910B Cube unit runs matmul on the
  # cube pipe and peak_table_910b.toml exposes no separate fp32 cube class,
  # so cube matmul is keyed to fp16_cube (the cube matmul peak class;
  # fp16/bf16 cube share 256 TFLOPS). Numeric accuracy is the W4.2 GPU
  # cross-check's job.
  # bytes (hbm): read a [B,L,D] + b [B,D,N], write C [B,L,N]; all float32
  # primary family -> dtype_size. Matches _matmul_launch_metadata's
  # bytes = bytes_per_elem*(m*k + n*k + m*n).
  flops: 2*B*L*N*D
  flops_class: fp16_cube
  bytes: (B*L*D + B*D*N + B*L*N) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: simple_pytorch_ok
