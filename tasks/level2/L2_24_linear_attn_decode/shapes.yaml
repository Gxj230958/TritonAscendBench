inputs:
  q:
    dims:
    - B
    - H
    - 1
    - D
    dtype: float32
    dist: randn
  k:
    dims:
    - B
    - H
    - 1
    - D
    dtype: float32
    dist: randn
  v:
    dims:
    - B
    - H
    - 1
    - D
    dtype: float32
    dist: randn
  kv_caches:
    dims:
    - B
    - H
    - D
    - D
    dtype: float32
    dist: randn
  slope_rate:
    dims:
    - H
    dtype: float32
    dist: rand
  slot_idx:
    dims:
    - B
    dtype: int64
    # Permutation of [0,B): scrambled slot routing (a bijection avoids the
    # in-place cache write-race) so the slot gather is load-bearing, not identity.
    dist: randperm
