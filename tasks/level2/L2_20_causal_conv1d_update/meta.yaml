tolerance_class: vector_reduce
cost_model:
  # Symbol audit. Single-step decode causal conv1d state update (seqlen==1).
  # Symbol map: B -> batch (== num gathered cache lines), D -> dim (channel
  # axis, x dim 1 == weight dim 0), KW -> KERNEL_WIDTH == weight dim 1 (the
  # depthwise tap count; state_len == KW-1 history window). Depthwise (grouped)
  # conv -> vector/reduce work, NOT a dense D*D matmul.
  # FLOPs (vector): per [B,D] output a length-KW window dot product ~ 2*KW
  # mul-adds, plus the bias add and SiLU (~6) -> B*D*(2*KW + 6).
  # bytes (hbm): read x[B,D] + gathered conv_state[B,D,KW-1] + weight[D,KW] +
  # bias[D]; write output[B,D] + rolled conv_state[B,D,KW-1] ->
  # (2*B*D + 2*B*D*(KW-1) + D*KW + D) elements; float32 primary family.
  flops: B*D*(2*KW + 6)
  flops_class: vector
  bytes: (2*B*D + 2*B*D*(KW-1) + D*KW + D) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
