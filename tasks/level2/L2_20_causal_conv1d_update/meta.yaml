  # has no tuple/None path for this shape, so name the return tensor and the
  # in-place buffer: the candidate output dict is built from both and compared
  # to the oracle's {output, conv_state}. S2 captures the conv_state mutation
  # generically (mutated-input snapshot), so this is anchor-only.
  return_plus_inplace:
    return_name: output
    inplace:
    - conv_state
