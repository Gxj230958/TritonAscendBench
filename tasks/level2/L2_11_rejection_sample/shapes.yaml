inputs:
  draft_token_ids:
    dims:
    - E*2
    dtype: int64
    dist: randint:0:N
  cu_num_draft_tokens:
    dims:
    - E
    dtype: int32
    dist: cumcount:to=E*2
  draft_probs:
    dims:
    - E*2
    - N
    dtype: float32
    dist: softmax_rows
  target_probs:
    dims:
    - E*2
    - N
    dtype: float32
    dist: softmax_rows
  bonus_token_ids:
    dims:
    - E
    dtype: int64
    dist: randint:0:N
  recovered_token_ids:
