    - E*2
    dtype: int64
    dist: randint:0:N
  uniform_probs:
    dims:
    - E*2
    dtype: float32
    dist: rand
  is_greedy:
    dims:
    - E
    dtype: int64
    dist: randint:0:2
  max_spec_len:
    scalar: 2
  x:
    dims:
    - B
    - N
    - D
    dtype: float16
    dist: randn
  num_draft_tokens:
    scalar: 4

