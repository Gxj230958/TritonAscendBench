# Knob grid for the MoE masked silu-and-mul + FP8 group-quant family.
# The GRADED host wrapper is `silu_and_mul_masked_post_quant_fwd`
# (kernel.py line 380), which drives the @triton.jit
# `_silu_and_mul_post_quant_kernel`. Its documented contract:
#   input        [expert_num, token_num_padded, hidden_dim]   (gate||up)
#   output       [expert_num, token_num_padded, hidden_dim//2] float8_e4m3fn
#   output_scale [expert_num, token_num_padded, hidden_dim//2 // quant_group_size] f32
#   masked_m     [expert_num]  (per-expert valid token count)
# size_n = hidden_dim // 2 must be a multiple of quant_group_size.
# Here E=expert_num, T=token_num_padded, D=size_n (== hidden_dim//2);
# input last dim is 2*D, output last dim is D, scale last dim is D//G.
size_knobs:
  B: 64
  L: 128
  D: 512
  Dv: 8
  N: 1024
  T: 256
  H: 16
  E: 16
  C: 32
  G: 8
