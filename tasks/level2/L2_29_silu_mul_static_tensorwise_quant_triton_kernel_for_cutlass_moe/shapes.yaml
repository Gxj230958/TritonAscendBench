inputs:
  # input[e, t, :D] = gate, input[e, t, D:] = up. fp32 so the kernel's
  # `gate.to(input.dtype)` cast (silu result back to input dtype) is a
  # no-op and the oracle's fp32 silu matches bit-for-bit.
  input:
    dims:
    - E
    - T
    - 2*D
    dtype: float32
    dist: randn
  # Per-expert valid token count in [0, T): exercises the mask so tokens
  # t >= masked_m[e] are never written (both outputs stay zero-init there).
  masked_m:
    dims:
    - E
    dtype: int64
    dist: randint:0:T
  # candidate_inplace: the runner pre-allocates these output buffers (zeros)
  # and the launcher / graded kernel writes into them. Rows t >= masked_m[e]
  # are never touched and stay zero, matching the masked oracle.
  output:
    dims:
    - E
    - T
    - D
    dtype: float8_e4m3fn
    dist: zeros
  # last dim = size_n // quant_group_size = D // 8 (quant_group_size is the
  # fixed scalar 8 below, NOT the generic `G` family knob).
  output_scale:
    dims:
    - E
    - T
    - D//8
    dtype: float32
    dist: zeros
  quant_group_size:
    scalar: 8
  fp8_max:
    scalar: 448.0

