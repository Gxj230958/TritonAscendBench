cost_model:
  # Symbol audit (approach §3.4). Plain per-row RMSNorm scaled by a weight
  # (fused_rmsnorm_kernel): out = x / sqrt(mean(x^2)+eps) * weight. No residual
  # add, single output. One program per row. Symbol map: B -> x rows (x dim 0,
  # the kernel grid extent), D -> hidden size (x dim 1 == weight length, the
  # per-row reduction extent). eps is a scalar literal.
  # FLOPs (vector): per element centred-square + mean for the RMS (~2), rsqrt
  # amortised (~1), normalise mul (~1), weight mul (~1) -> ~5*B*D.
  # bytes (hbm): read x[B,D] (B*D) + weight[D], write output[B,D] (B*D) ->
  # (2*B*D + D) elements; all float32 primary family -> dtype_size.
  flops: 5*B*D
  flops_class: vector
  bytes: (2*B*D + D) * dtype_size
  bytes_resource: hbm
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
