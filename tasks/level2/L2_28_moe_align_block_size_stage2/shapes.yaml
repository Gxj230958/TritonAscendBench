inputs:
  topk_ids:
    dims:
    - B
    - D
    dtype: int64
    # Span the full expert range [0,num_experts=4) so every expert receives
    # tokens and the per-expert offset/cumsum + empty-expert paths are exercised.
    dist: randint:0:4
  num_experts:
    scalar: 4
  block_size:
    scalar: 4

explicit_view:
  P1:
    provenance: baseline
