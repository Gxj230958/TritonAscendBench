# Operator input contract (WA.1, specs/task_api_contract.md §5.2). Mamba2
# chunk-scan forward over a varlen token stream. The fixture materialises the
# PHYSICAL upstream primitives: x / z [S, H, P], C [S, G, N], skip D [H, P],
# and the chunk_size scalar. The varlen chunk partition (cu_chunk_seqlens,
# seq_idx) and per-chunk tensors (cb [nchunks, G, CS, CS], dt / dA_cumsum
# [H, nchunks, CS], states [nchunks, H, P, N]) are DERIVED deterministically
# inside _pa_launcher.py / oracle_pytorch.py (byte-identical builders), since
# their chunk-axis length depends on (S, CS). fp32 throughout.
param_constraints:
  scaffold: false
  dims:
  - S >= 1
  - H >= 1
  - G >= 1
  - P >= 1
  - N >= 1
  - CS >= 1
  - H % G == 0
  - S > CS
  dtypes:
    x: float32
    C: float32
    z: float32
    D: float32
  dists:
    x:
      kind: randn
    C:
      kind: randn
    z:
      kind: randn
    D:
      kind: randn
  scalars:
    chunk_size: chunk_size in [16, 32, 64]
  tensor_invariants: []
