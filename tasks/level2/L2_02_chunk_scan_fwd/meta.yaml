cost_model:
  # Symbol audit (approach §3.4). Mamba2 chunk-scan forward over a varlen
  # token stream: per (chunk, head) it computes out = intra + inter, then the
  # optional D skip and silu(z) gating. shapes.yaml binds the PHYSICAL axes:
  # S -> seqlen (x/C/z token axis; = sum of all logical-chunk lengths),
  # H -> nheads, G -> ngroups (G | H), P -> headdim (the kernel BLOCK_SIZE_N
  # tile axis), N -> dstate (the inter contraction extent), CS -> chunk_size
  # (the kernel BLOCK_SIZE_M tile axis; per-chunk length len_c in (0, CS]).
  # Mixed compute -> map form. FLOPs(fp16_cube): the kernel issues two tl.dot's
  # per (chunk, head). inter = tl.dot(C, prev_states): for the len_c tokens of
  # a chunk it is [len_c, N] @ [N, P] -> 2*len_c*N*P; summed over all chunks
  # (sum len_c = S) and H heads -> 2*S*H*N*P. intra = tl.dot(cb, x): per chunk
  # causal [len_c, len_c] @ [len_c, P]; dense analytic upper bound per chunk is
  # 2*len_c^2*P <= 2*CS*len_c*P, so summed over chunks/heads <= 2*S*CS*H*P
  # (causal computes ~half). float32 operands run on the 910B Cube unit;
  # peak_table exposes no fp32 cube class so cube matmul is keyed to fp16_cube.
  # FLOPs(vector): per (chunk, head) seg = exp(min(dA_m-dA_k,0))*causal ~3 ops
  # plus cb*=seg, cb*=dt (2 muls) over len_c^2 entries (~5*CS*len_c summed);
  # scale_m = exp(dA) over len_c; intra+inter add, D*x skip (~3 ops) and
  # silu(z) gate (z*sigmoid(z) ~6 ops) over len_c*P. Summed over chunks/heads:
  # ~5*S*CS*H + 9*S*H*P. bytes(hbm): read x [S,H,P] + C [S,G,N] + z [S,H,P]
  # + D [H,P], plus the derived per-chunk cb/dt/dA_cumsum/states the wrapper
  # reads, and write out [S,H,P]; all float32 primary family -> dtype_size.
  # nchunks ~ S/CS (varlen, upper-bounded by 2*S/CS); cb is [nchunks,G,CS,CS]
  # ~ (S/CS)*G*CS*CS = S*G*CS, dt/dA_cumsum [H,nchunks,CS] ~ S*H, states
  # [nchunks,H,P,N] ~ (S/CS)*H*P*N.
  flops:
    fp16_cube: 2*S*H*N*P + 2*S*CS*H*P
    vector: 5*S*CS*H + 9*S*H*P
  bytes:
    hbm: (3*S*H*P + S*G*N + H*P + S*G*CS + 2*S*H + (S/CS)*H*P*N) * dtype_size
  gpu_xcheck_tol: 0.05
oracle_simplified: formula_exact_manual
