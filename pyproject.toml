[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-ascend-bench"
version = "0.1.0"
description = "Migration Benchmark for porting GPU Triton kernels to Huawei Ascend 910B via triton-ascend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "TritonAscendBench Authors" },
]
keywords = ["benchmark", "triton", "ascend", "npu", "910b", "migration", "vllm", "sglang"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.5.0",
    "triton>=3.0.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "safetensors>=0.4.0",
    "click>=8.0",
    "rich>=13.0",
    "einops>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
]
npu = [
    # torch_npu (Ascend PyTorch adapter) — install via Huawei wheel
    # triton-ascend — install via pip install triton-ascend
]
gpu = [
    # triton — already in core deps
]
automation = [
    # INTERNAL bench-team automation runtime; not in the release artifact.
    # Not part of the bench release artifact; install with `pip install -e ".[automation]"`.
    "requests>=2.31",
]
infer = [
    # Transitive deps imported by the vllm/sglang source trees under
    # infer/. We use those source trees directly (not pip-installed
    # vllm/sglang, so the per-task ``upstream_fp`` hash can pin the
    # exact infer/ bytes) which means pip cannot auto-pick these up
    # from vllm/sglang's own pyproject. List them here so setup_machine_a_gpu.sh
    # installs them and the oracle-consistency subprocess can actually
    # import vllm.config / sglang.srt.utils -- otherwise resolve mis-classifies
    # every affected task as upstream-not-invocable-here. Add new leaves
    # when vllm/sglang upgrade introduces a new top-level import.
    "pybase64",
    "pyzmq",
    "cbor2",
    "msgspec",
    "cachetools",
    "py-cpuinfo",
    "gguf",
    "openai-harmony",
    "openai",
    "partial-json-parser",
    # sglang's tokenizer / scheduler imports uvloop at module load
    # (sgl-kernel, srt.server, etc.). Without it L2_06_topk_log_softmax,
    # L2_11_rejection_sample and any sglang-rooted task get classified
    # ``upstream-not-invocable-here [No module named 'uvloop']``.
    "uvloop",
    # Added proactively after dev grep of vllm/sglang imports across all
    # vendored modules (top-N frequency + module-init likely). Each one
    # has shown up as a real ModuleNotFoundError during S2-smoke runs OR
    # is imported at module init by a vllm/sglang core file the bench's
    # candidate-search reaches. Adding here once so operators don't hit
    # "discover-one-by-one" smoke failures.
    "huggingface_hub",
    "packaging",
    "httpx",
    "jinja2",
    "starlette",
    "uvicorn",
    "jsonschema",
    "cloudpickle",
    "typing_extensions",
    "tabulate",
    "msgpack",
    "urllib3",
    # vllm/sglang core runtime deps -- vendored upstream source imports
    # these at module load time (e.g. sentencepiece via tokenizer pipeline,
    # transformers everywhere, blake3 via vllm caching, etc.). Without
    # them every kernel.py that pulls in a vllm or sglang facade module
    # blocks on ModuleNotFoundError before reaching its own logic.
    # CUDA-only / GPU-build deps (flash-attn, flashinfer, sgl-deep-gemm,
    # cuda-python, etc.) are intentionally omitted: those need the actual
    # GPU host, and the bench's CPU/TRITON_INTERPRET=1 oracle path does
    # not need them.
    "sentencepiece",
    "transformers",
    "tokenizers",
    "blake3",
    "protobuf",
    "aiohttp",
    "pydantic",
    "tiktoken",
    "lm-format-enforcer",
    "outlines_core",
    "diskcache",
    "lark",
    "xgrammar",
    "filelock",
    "interegular",
    "orjson",
    "prometheus-client",
    "python-multipart",
    "scipy",
    "setproctitle",
    "soundfile",
    "compressed-tensors",
    "easydict",
    "blobfile",
    "IPython",
    "datasets",
    "einops",
    "apache-tvm-ffi",
    "nvidia-ml-py",
    "llguidance",
    "tqdm",
    "psutil",
    "regex",
    "pillow",
    "requests",
]

[project.scripts]
tab = "ascendbench.engine.cli:main"

[project.urls]
Homepage = "https://github.com/<TBD>/triton-ascend-bench"
Documentation = "https://triton-ascend-bench.readthedocs.io"
Repository = "https://github.com/<TBD>/triton-ascend-bench"
Issues = "https://github.com/<TBD>/triton-ascend-bench/issues"

[tool.setuptools.packages.find]
include = ["ascendbench*"]
exclude = ["tests*", "tasks*", "results*", "specs*", "docs*", "infra*", "scripts*"]

[tool.setuptools.package-data]
ascendbench = ["policies/*.yaml", "policies/*.json", "policies/*.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (fast, no GPU/NPU)",
    "integration: integration tests (require GPU or NPU)",
    "adversarial: reward-hacking adversarial tests",
    "gpu: requires CUDA GPU",
    "npu: requires Ascend NPU",
    "slow: slow tests (>10s)",
]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
