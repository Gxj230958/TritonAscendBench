# Machine-readable tolerance policy
# Loaded by triton_ascend_bench/eval.py via tolerance_policy.lookup(class_name)
# Per spec: specs/tolerance_policy.md

schema_version: "1.0"

classes:
  elementwise:
    atol: 1.0e-3
    rtol: 1.0e-3
    notes: "Pointwise ops (silu, gelu, bias)"

  elementwise_exact_or_inf_safe:
    atol: 1.0e-6
    rtol: 0.0
    inf_must_match: true
    nan_must_match: true
    notes: "Additive ops on logits; -inf positions must match exactly"

  vector_reduce:
    atol: 1.0e-3
    rtol: 1.0e-3
    notes: "RMSNorm / LayerNorm / softmax"

  cube_matmul_fp16:
    atol: 5.0e-3
    rtol: 1.0e-3
    notes: "GEMM with FP32 accumulator"

  int8_w8a8:
    atol: 5.0e-2
    rtol: 1.0e-2
    notes: "W8A8 INT8 matmul"

  int8_quant_round:
    # V9 codex review 2026-05-27: int8 per-token / per-group quant
    # outputs (q int8) differ from PyTorch's torch.round-based oracle
    # by at most 1 ULP on tie-breaking (fp32 banker's rounding vs
    # Triton native round-half-away-from-zero). atol/rtol fields are
    # used for the auxiliary fp32 ``scale`` output; int_atol=1 governs
    # the int8 ``q`` output.
    atol: 1.0e-5
    rtol: 1.0e-5
    int_atol: 1
    notes: "int8 quant rounding (e.g. per_token_group_quant_int8)"

  int4_w4a8:
    atol: 5.0e-2
    rtol: 1.0e-2
    notes: "W4A8 grouped matmul"

  fp8_software_emulated:
    atol: 1.0e-1
    rtol: 5.0e-2
    fp8_ulp: 1
    notes: "910B has no FP8 cube; modeled in Roofline via vector compute + HBM (no FP8-cube peak); score-eligibility unaffected (eligibility.py only)"

  recurrent_chunk:
    atol: 5.0e-3
    rtol: 5.0e-3
    notes: "Mamba / GDN / KDA chunk pipelines"

  sampling_rng:
    atol: 0.0
    rtol: 0.0
    bit_exact: true
    notes: "Bit-exact when seed matches"

  atomic_scatter:
    atol: 1.0e-4
    rtol: 1.0e-4
    non_deterministic: true
    rerun_count: 3
    notes: "Non-deterministic; rerun for consistency"

  cumsum_scan:
    atol: 1.0e-3
    rtol: 1.0e-3
    notes: "Prefix scan accumulation"

  attention_flash:
    atol: 5.0e-3
    rtol: 1.0e-3
    notes: "Online softmax + matmul fused"

  mrope:
    atol: 1.0e-3
    rtol: 1.0e-3
    notes: "mRoPE position embedding"

# Per-dtype sentinel values (for output buffer poisoning detection)
sentinels:
  float32: "NaN"
  float16: "NaN"
  bfloat16: "NaN"
  int8: -128
  int16: -32768
  int32: -2147483648
  bool: "alternating_0xAA"
