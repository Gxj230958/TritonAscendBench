# Version Matrix -- records the host stack the GPU baseline is captured on.
# The bench runs on the GPU host's existing torch/triton/CUDA stack; it does
# not pin a frozen environment. This matrix documents the stack that a given
# baseline was captured under. Capturing on a different stack means the
# baseline is NOT directly comparable to one captured here -- after capturing
# on a new stack, update this matrix to reflect the actual host versions.

schema_version = "1.0"
benchmark_version = "v0.1"
captured_at = "2026-05-22T00:00:00Z"

# ============================================================================
# GPU side (H100 / A100 for GPU triton baseline)
# ============================================================================
[gpu]
arch = "x86_64"
os = "ubuntu22.04"
cuda = "12.6"
driver_min = "535.0"
python = "3.12"
torch = "2.9.1"
triton = "3.5.1"
# Docker image (digest filled when v0.1 release tag is cut on a 910B host).
# Empty string is the documented "unset" state, NOT a `<placeholder>`.
docker_image = ""
docker_digest = ""

# ============================================================================
# Phase A′ S2-gpu-authoritative + B′ ground-truth capture environment
# (v0.1 — records the stack used at capture time; capturing on a
# different stack means this matrix must be updated to match the host)
# ============================================================================
# Reuses [gpu]'s cuda/torch/triton/py pins. The device-dependent
# fields below have NO honest literal value off the capture host
# (plan U6 SHIP-w/-note: NEVER fabricate). They are the literal
# string "pending: filled-on-capture-host" until backfilled on the
# real GPU host. A `pending:` value is allowed by the schema check
# but a task whose semantics depend on it is NOT release-PASS.
[gpu_capture]
cuda = "12.6"              # = [gpu].cuda
torch = "2.9.1"            # = [gpu].torch
triton = "3.5.1"           # = [gpu].triton
python = "3.12"            # = [gpu].python
device_identity = "pending: filled-on-capture-host"
compute_capability = "pending: filled-on-capture-host"
fp8_semantics = "pending: filled-on-capture-host"
# einops is now declared in pyproject.toml [project].dependencies, so
# `pip install -e .` provides it; no separate pin is needed here.
extra_pins = []

# ============================================================================
# NPU side (Ascend 910B / Atlas A2)
# ============================================================================
[npu]
arch = "aarch64"  # or x86_64 depending on Atlas server
os = "openEuler 22.03"
cann = "8.5.0"
hdk = "25.5.2"
driver = ""              # populated at v0.1 release on real 910B host
python = "3.11"
torch = "2.8.0"
torch_npu = "2.8.0.post1"  # PyTorch Ascend adapter
triton_ascend = "3.2.0"  # x86; ARM uses 3.5.0 per quick_start
memfabric = "1.0.5"
docker_image = "quay.io/ascend/cann:8.5.0-py3.11"
docker_digest = ""

# ============================================================================
# Common Python deps
# ============================================================================
[python_deps]
numpy = "1.26.4"
pyyaml = "6.0.1"
safetensors = "0.7.0"
click = "8.3.3"
rich = ""  # not in the host image; pip installs it (>=13.0 per pyproject)

# ============================================================================
# Upstream sources (frozen at Phase 1.2 per task)
# ============================================================================
[upstream]
# Per-task commit SHAs live in tasks/*/meta.yaml upstream.commit_sha.
# These two fields document the upstream repo identity only.
vllm = "vllm-project/vllm"
sglang = "sgl-project/sglang"

# ============================================================================
# Hardware specs (for utilization computation)
# ============================================================================
[hardware.h100]
peak_fp16_tflops = 989  # H100 SXM5
peak_int8_tops = 1979
hbm_bandwidth_gbps = 3350

[hardware.910b]
peak_fp16_tflops = 256
peak_int8_tops = 512
hbm_bandwidth_gbps = 1600
ub_size_kb = 192  # Unified Buffer per AI core, critical for triton-ascend tile design

# ============================================================================
# Benchmark protocol parameters
# ============================================================================
[protocol]
correctness_trials = 5
warmup_iterations = 10
measurement_trials = 100
independent_runs = 3
cv_threshold_pct = 10
host_event_drift_threshold_pct = 10
speedup_cap = 5.0
speedup_floor_epsilon = 0.01
min_coverage_for_ranking = 0.70  # native_coverage >= 70% of |S_native|

# Sentinel patterns (per dtype)
[protocol.sentinels]
float = "NaN"
int8 = -128  # INT8_MIN
int16 = -32768  # INT16_MIN
int32 = -2147483648  # INT32_MIN
bool = "alternating"  # 0xAA mask
